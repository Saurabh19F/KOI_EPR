    function updatePlannerTabUI() {
        var isPending = plannerActiveTab !== 'allocated';
        function paintTab($tab, active) {
          // Keep both planner tabs visible. The dedicated classes below override the
          // global #viewsContainer button { color:#fff !important; } rule.
          $tab.show()
            .removeClass('bg-indigo-600 text-white border-indigo-600 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 border-slate-300 dark:border-slate-700 planner-tab-active planner-tab-inactive')
            .addClass(active ? 'planner-tab-active' : 'planner-tab-inactive')
            .css({
              visibility: 'visible',
              opacity: 1,
              borderStyle: 'solid',
              borderWidth: '1px',
              backgroundColor: active ? '#4f46e5' : '#ffffff'
            });
          // Set color on child spans themselves. This avoids the global
          // #viewsContainer button { color:#fff !important; } inheritance issue.
          $tab.find('.planner-tab-label, .planner-tab-count').css('color', active ? '#ffffff' : '#4338ca');
        }
        paintTab($('#planner-tab-pending'), isPending);
        paintTab($('#planner-tab-allocated'), !isPending);
        $('#planner-select-all').prop('checked', false).prop('disabled', !isPending);
        $('#planner-bulk-allocate-btn').toggleClass('hidden', !isPending);
    }

    function updatePlannerBulkSelectionUI() {
        var validCount = 0;
        Object.keys(selectedPlannerUids).forEach(function(uid) {
          var po = plannerDataMap[uid];
          if (po && Number(po.unplannedQty || 0) > 0) validCount++;

        });
        $('#planner-bulk-selected-count').text(validCount);
        $('#planner-bulk-allocate-btn').prop('disabled', validCount === 0 || plannerActiveTab === 'allocated');
    }

    function showBulkPlannerAllocationPopup() {
        var selected = Object.keys(selectedPlannerUids).map(function(uid) { return plannerDataMap[uid]; }).filter(function(po) {
          return po && Number(po.unplannedQty || 0) > 0;
        });
        if (!selected.length) {
          Swal.fire('Select Items', 'Please select at least one pending item for bulk allocation.', 'info');
          return;
        }

        // Bulk allocation needs the Warehouse master too. The single-item planner
        // popup already refreshes this list when it is empty, but the bulk popup
        // previously opened immediately and therefore rendered only "Select WH".
        // Fetch only when needed, then reopen the same bulk popup with the loaded list.
        if (!globalLists || !Array.isArray(globalLists.warehouses) || !globalLists.warehouses.length) {
          showLoading(true);
          google.script.run
            .withSuccessHandler(function(lists) {
              showLoading(false);
              globalLists = lists || { warehouses: [], products: [], vendorCodes: [], rejectReasons: [] };
              if (!globalLists.warehouses || !globalLists.warehouses.length) {
                Swal.fire('Warehouse Master Empty', 'No warehouse was found in the Warehouses sheet. Please register a warehouse first.', 'warning');

        total += Number($(this).val()) || 0;

      var balanceAfter = maxQty - total;
      $('#plan-balance-after-popup').text(balanceAfter);

      var confirmBtn = Swal.getConfirmButton();
      if (confirmBtn) {
        if (total <= 0 || total > maxQty) {
          confirmBtn.setAttribute('disabled', 'disabled');
          confirmBtn.style.opacity = '0.5';
        } else {
          confirmBtn.removeAttribute('disabled');
          confirmBtn.style.opacity = '1';

    function cleanDisplayVal(val, defaultFallback) {
      if (defaultFallback === undefined) defaultFallback = "";
      if (val === null || val === undefined) return defaultFallback;
      var str = val.toString().trim();
      var upper = str.toUpperCase();
      if (str === "" || upper === "N/A" || upper === "NA" || upper === "N.A." || upper === "NULL" || upper === "UNDEFINED" || upper === "NONE" || upper === "NOT AVAILABLE") {
        return defaultFallback;
      }
      return str;
    }

    // Final UI guard: missing-data markers must never be shown inside tables or forms.
    function scrubNoDataMarkers(root) {
      var scope = root || document;
      var target = scope.nodeType === 1 || scope.nodeType === 9 ? scope : document;
      var walker = document.createTreeWalker(target, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node) {
          var parent = node.parentElement;
          if (!parent || /^(SCRIPT|STYLE|NOSCRIPT)$/i.test(parent.tagName)) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      var node;
      while ((node = walker.nextNode())) {
        var txt = (node.nodeValue || '').trim();
        if (/^(N\/?A|N\.A\.|NA|NULL|UNDEFINED|NONE|NOT AVAILABLE)$/i.test(txt)) {
          node.nodeValue = '';
        } else {
          // Also remove missing-data markers used as a value after a label, e.g. "PO: N/A".
          node.nodeValue = (node.nodeValue || '')
            .replace(/(:\s*)(N\/?A|N\.A\.|NA|NULL|UNDEFINED|NONE|NOT AVAILABLE)(?=\s*$)/ig, '$1');
        }
      }
      if (target.querySelectorAll) {
        target.querySelectorAll('input, textarea').forEach(function(el) {
          if (/^(N\/?A|N\.A\.|NA|NULL|UNDEFINED|NONE|NOT AVAILABLE)$/i.test((el.value || '').trim())) el.value = '';
          if (/^(N\/?A|N\.A\.|NA|NULL|UNDEFINED|NONE|NOT AVAILABLE)$/i.test((el.placeholder || '').trim())) el.placeholder = '';
        });
        target.querySelectorAll('option').forEach(function(opt) {
          if (/^(N\/?A|N\.A\.|NA|NULL|UNDEFINED|NONE|NOT AVAILABLE)$/i.test((opt.textContent || '').trim())) opt.textContent = '';
        });
      }
    }

    // PERFORMANCE V22: batch dynamic DOM cleanup. DataTables can add hundreds of
    // nodes in one render; scrubbing every node separately caused repeated full walks.
    if (!window.__imsNoDataObserverInstalled) {
      window.__imsNoDataObserverInstalled = true;
      document.addEventListener('DOMContentLoaded', function() { scrubNoDataMarkers(document); });
      var noDataScrubTimer = null;
      var noDataObserver = new MutationObserver(function() {
        if (noDataScrubTimer) return;
        noDataScrubTimer = setTimeout(function() {
          noDataScrubTimer = null;
          scrubNoDataMarkers(document);
        }, 180);
      });
      noDataObserver.observe(document.documentElement, { childList: true, subtree: true });

    // ============================================================
    // SMART APPS SCRIPT FAILURE / NETWORK RECOVERY
    // ============================================================
    var imsNetworkRecovery = {
      timer: null,
      lastRetryAt: 0,
      consecutiveTransientFailures: 0
    };

    function getFailureMessage(error) {
      if (!error) return '';
      try {
        return String(error.message || error.details || error.reason || error || '').trim();
      } catch (_) {
        return '';
      }
    }

    function isTransientTransportFailure(error) {
      if (navigator && navigator.onLine === false) return true;

      var msg = getFailureMessage(error).toLowerCase();

      // Apps Script occasionally returns an empty/opaque failure object for
      // transport interruptions. Treat that as transient, not as a business error.
      if (!msg) return true;

      var transportPatterns = [
        'network',
        'failed to fetch',
        'fetch failed',
        'connection',
        'disconnected',
        'timeout',
        'timed out',
        'service unavailable',
        'temporarily unavailable',
        'internal error',
        'server error',
        '502',
        '503',
        '504'
      ];

      return transportPatterns.some(function(pattern) {
        return msg.indexOf(pattern) !== -1;
      });
    }

    function refreshCurrentViewAfterTransportFailure() {
      if (!currentUser) return;
      // A filtered page is a deliberate user state. Network recovery must not
      // replace it with freshly loaded unfiltered data.
      if (imsPageFilterActive) return;

      try {
        invalidatePerfCaches();
      } catch (_) {}

      // Never replay the failed write itself. We only re-fetch the current
      // screen, preventing duplicate GRNs, transfers, adjustments, etc.
      if ($('#transferHistoryView').is(':visible')) {
        loadTransferHistory();
      } else if ($('#grnHistoryView').is(':visible')) {
        loadGrnHistoryData();
      } else if ($('#stockReportView').is(':visible')) {
        loadStockReport();
      } else if ($('#warehouseManagerView').is(':visible')) {
        loadManagerData();
      } else if ($('#warehouseMgmtView').is(':visible')) {
        loadWarehouseMgmtData();
      } else if ($('#purchasePanelView').is(':visible') || $('#purchaseHistoryView').is(':visible')) {
        loadPurchasePanelData();
      } else if ($('#qcPendingView').is(':visible') || $('#qcHistoryView').is(':visible')) {
        loadQualityDashboardData();
      } else {
        loadDashboardData(true);
      }
    }

    function scheduleSafeNetworkRecovery() {
      var now = Date.now();

      // Prevent loops / retry storms.
      if (imsNetworkRecovery.timer) return;
      if (now - imsNetworkRecovery.lastRetryAt < 2500) return;

      imsNetworkRecovery.lastRetryAt = now;

      imsNetworkRecovery.timer = setTimeout(function() {
        imsNetworkRecovery.timer = null;

        if (navigator && navigator.onLine === false) {
          return;
        }

        refreshCurrentViewAfterTransportFailure();
      }, 1200);
    }

    window.addEventListener('online', function() {
      imsNetworkRecovery.consecutiveTransientFailures = 0;
      try {
        if (currentUser) refreshCurrentViewAfterTransportFailure();
      } catch (e) {
        console.warn('Online recovery refresh skipped:', e);
      }
    });

    function onFailure(error) {
      showLoading(false);

      var rawMessage = getFailureMessage(error);
      var transient = isTransientTransportFailure(error);

      // Log the real error silently when the global error logger is available.
      try {
        if (typeof reportClientError === 'function') {
          reportClientError(
            error || new Error(rawMessage || 'Apps Script transport failure'),
            transient ? 'google.script.run.transport' : 'google.script.run.server',
            { silent: true }
          );
        }
      } catch (_) {}

      if (transient) {
        imsNetworkRecovery.consecutiveTransientFailures++;

        if (navigator && navigator.onLine === false) {
          Swal.fire({
            title: 'You are offline',
            text: 'Internet connection is unavailable. The app will refresh automatically when the connection returns.',
            icon: 'warning',
            confirmButtonText: 'OK'
          });
          return;
        }

        scheduleSafeNetworkRecovery();

        // First transient failure: recover quietly instead of showing the old
        // misleading "Network error. Reverted." popup.
        if (imsNetworkRecovery.consecutiveTransientFailures <= 1) {
          if (window.Swal && Swal.fire) {
            Swal.fire({
              toast: true,
              position: 'top-end',
              icon: 'info',
              title: 'Connection interrupted — refreshing data…',
              showConfirmButton: false,
              timer: 1800,
              timerProgressBar: true
            });
          }
          return;
        }

        Swal.fire({
          title: 'Connection problem',
          text: rawMessage || 'The request did not receive a response from Google Apps Script. Your current screen is being refreshed automatically.',
          icon: 'warning',
          confirmButtonText: 'Retry now',
          showCancelButton: true,
          cancelButtonText: 'Close'
        }).then(function(result) {
          if (result.isConfirmed) {
            imsNetworkRecovery.consecutiveTransientFailures = 0;
            refreshCurrentViewAfterTransportFailure();
          }
        });
        return;
      }

      // A real server/business validation error should never be labelled as a
      // network error.
      imsNetworkRecovery.consecutiveTransientFailures = 0;

      var msg = rawMessage || 'The server rejected this request, but did not return an error message.';
      Swal.fire({
        title: 'Request Failed',
        text: msg,
        icon: 'error',
        confirmButtonText: 'OK'
      });
    }

    // ============================================================
    // GLOBAL AUTO ERROR HANDLING + GRN REPRINT RECOVERY
    // ============================================================
    var __imsLastErrorKey = '';
    var __imsLastErrorAt = 0;

    function normalizeClientError(error, context) {
      var message = 'Unknown application error';
      var stack = '';
      try {
        if (error) {
          message = error.message || error.reason || String(error);
          stack = error.stack || '';
        }
      } catch (_) {}

      return {
        message: message,
        stack: stack,
        context: context || 'client',
        url: location.href,
        userAgent: navigator.userAgent,
        user: currentUser ? {
          username: currentUser.username || '',
          name: currentUser.name || '',
          role: currentUser.role || '',
          warehouseId: currentUser.warehouseId || ''
        } : null,
        timestamp: new Date().toISOString()
      };
    }

    function reportClientError(error, context, options) {
      options = options || {};
      var info = normalizeClientError(error, context);

      try {
        console.error('[IMS ERROR][' + info.context + ']', error);
        showLoading(false);
      } catch (_) {}

      // Avoid flooding the same popup/log repeatedly.
      var key = info.context + '|' + info.message;
      var now = Date.now();
      var duplicate = (__imsLastErrorKey === key && now - __imsLastErrorAt < 2500);
      __imsLastErrorKey = key;
      __imsLastErrorAt = now;

      // Fire-and-forget backend logging; logging failure must never break UI.
      try {
        if (window.google && google.script && google.script.run) {
          google.script.run
            .withFailureHandler(function(){})
            .logClientError(info);
        }
      } catch (_) {}

      if (!duplicate && options.silent !== true && window.Swal) {
        var isDark = $('html').hasClass('dark');
        Swal.fire({
          title: options.title || 'Application Error',
          html:
            '<div class="text-left">' +
              '<p class="text-sm mb-2">' + escapeHtmlSafe(info.message) + '</p>' +
              '<p class="text-xs text-slate-500">The error was handled automatically. You can retry the action.</p>' +
            '</div>',
          icon: 'error',
          confirmButtonText: 'OK',
          background: isDark ? '#111827' : '#ffffff',
          color: isDark ? '#f8fafc' : '#1e293b'
        });
      }

      return info;
    }

    function escapeHtmlSafe(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('error', function(event) {
      reportClientError(
        event.error || new Error(event.message || 'JavaScript runtime error'),
        'window.onerror'
      );
    });

    window.addEventListener('unhandledrejection', function(event) {
      reportClientError(
        event.reason || new Error('Unhandled Promise rejection'),
        'unhandledrejection'
      );
    });

    function safeUiAction(context, action) {
      try {
        return action();
      } catch (e) {
        reportClientError(e, context);
        return null;
      }
    }

    // ---------- GRN REPRINT / UNIFIED PDF PREVIEW ----------
    // Preview and print both use the exact same server-side HTML that is used
    // to create the GRN PDF attached to email. No duplicate frontend slip template.
    function renderUnifiedGrnPreview(htmlContent, receiptId) {
      if (!htmlContent) {
        throw new Error('GRN printable document could not be generated.');
      }

      var frameId = 'grnUnifiedPrintFrame';
      var iframe = document.createElement('iframe');
      iframe.id = frameId;
      iframe.setAttribute('title', 'GRN ' + (receiptId || '') + ' Print Preview');
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.minHeight = '720px';
      iframe.style.border = '0';
      iframe.style.background = '#ffffff';
      iframe.srcdoc = htmlContent;

      var body = document.getElementById('grnPrintModalBody');
      if (!body) throw new Error('GRN preview container is unavailable.');
      body.innerHTML = '';
      body.style.padding = '0';
      body.style.background = '#ffffff';
      body.appendChild(iframe);

      $('#grnPrintModal').removeClass('hidden');
      setTimeout(function() {
        $('.print-modal-box').removeClass('scale-95 opacity-0').addClass('scale-100 opacity-100');
        safeCreateIcons();
      }, 50);
    }

    function loadUnifiedGrnPreview(receiptId) {
      if (!receiptId) {
        onFailure(new Error('Receipt ID is missing. Refresh Receiving History and use Reprint.'));
        return;
      }

      showLoading(true);
      google.script.run
        .withSuccessHandler(function(htmlContent) {
          showLoading(false);
          try {
            renderUnifiedGrnPreview(htmlContent, receiptId);
          } catch (e) {
            onFailure(e);
          }
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          onFailure(err);
        })
        .getGrnPrintableHtml(receiptId, currentUser);
    }

        if (!receiptId) {

    function printMultiGRNSlip(multiData) {

    var IMS_DESKTOP_BREAKPOINT = 1024;
    var IMS_PHONE_BREAKPOINT = 767;

    function imsEffectiveViewportWidth() {
      var vals = [];
      try { if (window.innerWidth) vals.push(Number(window.innerWidth)); } catch (_) {}
      try { if (window.visualViewport && window.visualViewport.width) vals.push(Number(window.visualViewport.width)); } catch (_) {}
      try { if (window.screen && window.screen.width) vals.push(Number(window.screen.width)); } catch (_) {}
      vals = vals.filter(function(v) { return isFinite(v) && v > 0; });
      return vals.length ? Math.min.apply(Math, vals) : 1024;
    }

    function isPhoneViewport() {
      return imsEffectiveViewportWidth() <= IMS_PHONE_BREAKPOINT;
    }

    function isDesktopViewport() {
      return imsEffectiveViewportWidth() >= IMS_DESKTOP_BREAKPOINT;
    }

    function syncResponsiveRootClass() {
      var phone = isPhoneViewport();
      document.documentElement.classList.toggle('ims-mobile-layout', phone);

    // MOBILE TABLE / VIEW ENHANCER v9
    // Converts dense desktop tables into labelled cards on phones,
    // while restoring their normal desktop/tablet layout above 767px.
    // ============================================================
    function imsNormalizeLabel(txt) {
      return String(txt || '')
        .replace(/[▲▼↕]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function imsEnhanceResponsiveTables() {
      var mobile = isPhoneViewport();
      var root = document.getElementById('viewsContainer');
      if (!root) return;

      var tables = root.querySelectorAll('table');
      tables.forEach(function(table) {
        if (table.closest('#grnPrintModal') || table.hasAttribute('data-no-mobile-cards')) return;

        if (!mobile) {
          if (table.classList.contains('ims-auto-responsive')) {
            table.classList.remove('ims-auto-responsive');
          }
          return;
        }

        table.classList.add('ims-auto-responsive');
        var headers = Array.prototype.map.call(table.querySelectorAll('thead th'), function(th) {
          return imsNormalizeLabel(th.textContent);
        });

        table.querySelectorAll('tbody tr').forEach(function(tr) {
          Array.prototype.forEach.call(tr.children, function(td, i) {
            if (td.tagName !== 'TD') return;
            var current = td.getAttribute('data-label');
            var label = current || headers[i] || (i === tr.children.length - 1 ? 'Action' : 'Details');
            td.setAttribute('data-label', label);
          });
        });
      });
    }

    var imsResponsiveEnhanceTimer = null;
    function imsScheduleResponsiveEnhance() {
      clearTimeout(imsResponsiveEnhanceTimer);
      imsResponsiveEnhanceTimer = setTimeout(function() {
        imsEnhanceResponsiveTables();
        try {
          Object.keys(tableInstances || {}).forEach(function(key) {
            var dt = tableInstances[key];
            if (dt && dt.columns && typeof dt.columns.adjust === 'function' && !isPhoneViewport()) {
              dt.columns.adjust();
            }
          });
        } catch (_) {}
      }, 60);
    }

    function openProductionBulkMaterialSelector($row) {
      var sourceWarehouse = ($row.find('.production-requirement-source-wh').val() || '').toString().trim();
      if (!sourceWarehouse) {
        Swal.fire('Select Source Warehouse', 'Bulk material selection se pehle Source Warehouse select karein.', 'info');
        return;
      }

      var availableItems = (productionRequirementMaterialOptions.items || []).filter(function(item) {
        return Number((item.warehouseStocks || {})[sourceWarehouse] || 0) > 0;
      });
      if (!availableItems.length) {
        Swal.fire('No Stock', sourceWarehouse + ' me request ke liye koi available material nahi mila.', 'info');
        return;
      }

      var previous = getProductionBulkMaterialsForRow($row);
      var previousMap = {};
      previous.forEach(function(x) { previousMap[String(x.productId || '')] = Number(x.qty || 0); });

      var rowsHtml = availableItems.map(function(item, idx) {
        var pid = String(item.productId || '');
        var stock = Number((item.warehouseStocks || {})[sourceWarehouse] || 0);
        var checked = previousMap[pid] > 0;
        var qty = checked ? previousMap[pid] : '';
        return '<tr class="production-bulk-pick-row border-b border-slate-100 dark:border-slate-800" data-product-id="' + escapeAttr(pid) + '" data-stock="' + stock + '">' +
          '<td class="px-2 py-2 text-center"><input type="checkbox" class="production-bulk-pick-check h-4 w-4" ' + (checked ? 'checked' : '') + '></td>' +
          '<td class="px-2 py-2"><div class="font-bold">' + escapeHtmlSafe(item.productName || pid) + '</div><div class="font-mono text-[10px] text-slate-500">' + escapeHtmlSafe(pid) + '</div></td>' +
          '<td class="px-2 py-2 text-center font-bold text-emerald-600">' + stock + (item.uom ? ' ' + escapeHtmlSafe(item.uom) : '') + '</td>' +
          '<td class="px-2 py-2"><input type="number" min="0.0001" max="' + stock + '" step="any" class="production-bulk-pick-qty form-input-styled text-xs" value="' + escapeAttr(qty) + '" placeholder="Qty"></td>' +
        '</tr>';
      }).join('');

      Swal.fire({
        title: 'Bulk Select Required Materials',
        width: 900,
        html: '<div class="text-left"><div class="mb-3 text-xs text-slate-500">Source Warehouse: <b>' + escapeHtmlSafe(sourceWarehouse) + '</b>. Multiple materials tick karke har item ki exact Qty enter karein.</div>' +
          '<div class="max-h-[520px] overflow-y-auto border border-slate-200 dark:border-slate-700 rounded-xl"><table class="w-full text-xs"><thead class="sticky top-0 bg-slate-100 dark:bg-slate-800"><tr><th class="p-2">Select</th><th class="p-2 text-left">Material</th><th class="p-2">Available</th><th class="p-2 text-left">Request Qty</th></tr></thead><tbody>' + rowsHtml + '</tbody></table></div></div>',
        showCancelButton: true,
        confirmButtonText: 'Use Selected Materials',
        didOpen: function() {
          $(Swal.getHtmlContainer()).on('change', '.production-bulk-pick-check', function() {
            var $r = $(this).closest('.production-bulk-pick-row');
            if ($(this).is(':checked')) $r.find('.production-bulk-pick-qty').focus();
          });
        },
        preConfirm: function() {
          var selected = [];
          var err = '';
          $('.production-bulk-pick-row').each(function() {
            var $r = $(this);
            if (!$r.find('.production-bulk-pick-check').is(':checked')) return;
            var pid = String($r.attr('data-product-id') || '').trim();
            var stock = Number($r.attr('data-stock') || 0);
            var qty = Number($r.find('.production-bulk-pick-qty').val());
            if (!pid || !isFinite(qty) || qty <= 0) { err = 'Har selected material ke liye valid quantity enter karein.'; return false; }
            if (qty > stock) { err = pid + ' ki request Qty available stock ' + stock + ' se zyada hai.'; return false; }
            selected.push({ productId: pid, qty: qty });
          });
          if (err) { Swal.showValidationMessage(err); return false; }
          if (!selected.length) { Swal.showValidationMessage('Kam se kam 1 material select karein.'); return false; }
          return selected;
        }
      }).then(function(result) {
        if (result.isConfirmed) setProductionBulkMaterialsForRow($row, result.value || []);
      });
    }

    function sendAllProductionMaterialRequests() {
      var requests = [];
      var errorMessage = '';
      var sharedRemarks = ($('#production-requirement-batch-remarks').val() || '').toString().trim();
      var jobRemarks = ($('#production-job-remarks').val() || '').toString().trim();

      $('#production-requirement-excel-body .production-requirement-excel-row').each(function(rowIndex) {
        var $row = $(this);
        var sourceWarehouse = ($row.find('.production-requirement-source-wh').val() || '').toString().trim();
        var plannedQty = Number($row.find('.production-requirement-production-qty').val());
        var productionBalance = Number($row.attr('data-production-balance') || 0);
        var materials = getProductionBulkMaterialsForRow($row);
        var selectedIds = {};

        if (!errorMessage && (!isFinite(plannedQty) || plannedQty <= 0)) errorMessage = 'Row ' + (rowIndex + 1) + ' mein valid Production Qty enter karein.';
        else if (!errorMessage && plannedQty > productionBalance) errorMessage = 'Row ' + (rowIndex + 1) + ' ki Production Qty balance ' + productionBalance + ' se zyada hai.';
        else if (!errorMessage && !sourceWarehouse) errorMessage = 'Row ' + (rowIndex + 1) + ' mein Source Warehouse select karein.';
        else if (!errorMessage && !materials.length) errorMessage = 'Row ' + (rowIndex + 1) + ' mein Bulk Select Materials se kam se kam 1 required item select karein.';

        materials.forEach(function(material, itemIndex) {
          var productId = String(material.productId || '').trim();
          var qty = Number(material.qty || 0);
          var item = (productionRequirementMaterialOptions.items || []).find(function(candidate) { return String(candidate.productId || '') === productId; });
          var available = item ? Number((item.warehouseStocks || {})[sourceWarehouse] || 0) : 0;
          if (!errorMessage && (!productId || !item)) errorMessage = 'Row ' + (rowIndex + 1) + ', material ' + (itemIndex + 1) + ' invalid hai.';
          else if (!errorMessage && (!isFinite(qty) || qty <= 0)) errorMessage = 'Row ' + (rowIndex + 1) + ', material ' + (itemIndex + 1) + ' ki Qty invalid hai.';
          else if (!errorMessage && qty > available) errorMessage = 'Row ' + (rowIndex + 1) + ', ' + productId + ' ki quantity available stock ' + available + ' se zyada hai.';
          else if (!errorMessage && selectedIds[productId]) errorMessage = 'Row ' + (rowIndex + 1) + ' mein same required item duplicate hai.';
          selectedIds[productId] = true;
        });

        requests.push({
          orderNo: ($row.attr('data-order-no') || '').toString(),
          finalProductId: ($row.attr('data-final-product-id') || '').toString(),
          sourceWarehouse: sourceWarehouse,
          plannedQty: plannedQty,
          materials: materials,
          remarks: sharedRemarks,
          jobRemarks: jobRemarks
        });
      });

      if (!requests.length) errorMessage = 'Requirement table empty hai. Selected details dobara fetch karein.';
      if (errorMessage) {
        Swal.fire('Complete Table', errorMessage, 'warning');
        return;
      }

      showLoading(true);
      google.script.run
        .withSuccessHandler(function(response) {
          showLoading(false);
          $('#production-requirement-sheet').addClass('hidden');
          $('#production-requirement-excel-body').empty();
          Swal.fire('Request & Job Created', response.message, 'success');
          loadProductionTrackingPanel(true);
        })
        .withFailureHandler(onFailure)
        .createProductionMaterialRequestsBatch({ requests: requests }, currentUser);
    }

          '<td data-label="Product" class="px-3 py-3"><div class="font-bold text-slate-900 dark:text-white">' + escapeHtmlSafe(job.productName) + '</div><div class="font-mono text-[10px] text-slate-500 break-all">' + escapeHtmlSafe(job.productId) + '</div></td>' +
          '<td data-label="Planned Qty" class="px-3 py-3 text-center font-black text-indigo-600">' + Number(job.plannedQty || 0) + ' ' + escapeHtmlSafe(job.uom || '') + '</td>' +
          '<td data-label="Started" class="px-3 py-3 text-xs"><div>' + escapeHtmlSafe(job.startDate || '') + '</div><div class="text-slate-500">' + escapeHtmlSafe(job.startedBy || '') + '</div></td>' +
          '<td data-label="Status" class="px-3 py-3"><span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold ' + statusClass + '">' + escapeHtmlSafe(job.status || 'In Progress') + '</span></td>' +
          '<td data-label="Action" class="action-cell px-3 py-3 text-right">' + actionHtml + '</td>' +
        '</tr>';
      }).join('');
      if (!activeHtml) activeHtml = '<tr><td colspan="7" class="px-4 py-10 text-center text-slate-400">No active production jobs.</td></tr>';
      $('#production-active-jobs-body').html(activeHtml);

      var historyHtml = completed.slice().reverse().map(function(job) {
        return '<tr class="hover:bg-slate-50 dark:hover:bg-slate-800/60">' +
          '<td data-label="Production ID" class="px-3 py-3 font-mono text-[11px] font-bold text-indigo-600 dark:text-indigo-400">' + escapeHtmlSafe(job.productionId) + '</td>' +
          '<td data-label="Order No" class="px-3 py-3 font-bold">' + escapeHtmlSafe(job.orderNo) + '</td>' +
          '<td data-label="Product" class="px-3 py-3"><div class="font-bold">' + escapeHtmlSafe(job.productName) + '</div><div class="font-mono text-[10px] text-slate-500 break-all">' + escapeHtmlSafe(job.productId) + '</div></td>' +
          '<td data-label="Planned" class="px-3 py-3 text-center font-bold">' + Number(job.plannedQty || 0) + '</td>' +
          '<td data-label="Final Produced" class="px-3 py-3 text-center font-black text-emerald-600">' + Number(job.finalQty || 0) + '</td>' +
          '<td data-label="Closed" class="px-3 py-3 text-xs">' + escapeHtmlSafe(job.closingDate || '') + '</td>' +
          '<td data-label="Closed By" class="px-3 py-3 text-xs font-bold">' + escapeHtmlSafe(job.closedBy || '') + '</td>' +
          '<td data-label="Details" class="action-cell px-3 py-3 text-right"><button type="button" class="production-view-job-btn bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg text-xs font-bold" data-production-id="' + escapeAttr(job.productionId) + '">View Details</button></td>' +
        '</tr>';
      }).join('');
      if (!historyHtml) historyHtml = '<tr><td colspan="8" class="px-4 py-10 text-center text-slate-400">No completed production history.</td></tr>';
      $('#production-history-body').html(historyHtml);
      safeCreateIcons();
      imsScheduleResponsiveEnhance();
    }

    function showProductionClosingPopup(productionId) {
      var job = productionTrackingJobs.find(function(x) { return x.productionId === productionId; });
      if (!job) {
        Swal.fire('Not Found', 'Production job data refresh karein.', 'error');
        return;
      }

      showLoading(true);
      google.script.run
        .withSuccessHandler(function(data) {
          showLoading(false);
          var materials = data.materials || [];
          var materialRows = materials.map(function(material) {
            return '<tr class="production-close-material-row" data-request-id="' + escapeAttr(material.requestId || '') + '" data-received-qty="' + Number(material.receivedQty || 0) + '">' +
              '<td class="border border-slate-300 dark:border-slate-700 px-2 py-2"><div class="font-bold">' + escapeHtmlSafe(material.productName || material.productId || '') + '</div><div class="font-mono text-[10px] text-slate-500">' + escapeHtmlSafe(material.productId || '') + '</div></td>' +
              '<td class="border border-slate-300 dark:border-slate-700 px-2 py-2 font-bold">' + escapeHtmlSafe(material.sourceWarehouse || '') + '</td>' +
              '<td class="border border-slate-300 dark:border-slate-700 px-2 py-2 text-right font-black text-blue-600">' + Number(material.receivedQty || 0) + '</td>' +
              '<td class="border border-slate-300 dark:border-slate-700 p-1"><input type="number" min="0" max="' + Number(material.receivedQty || 0) + '" step="any" value="0" class="production-returned-qty form-input-styled bg-white dark:bg-slate-900 text-right font-bold"></td>' +
              '<td class="border border-slate-300 dark:border-slate-700 p-1 min-w-[210px]"><input type="text" class="production-return-reason form-input-styled bg-white dark:bg-slate-900 text-xs" placeholder="Reason required if return qty > 0"></td>' +
              '<td class="production-used-qty border border-slate-300 dark:border-slate-700 px-2 py-2 text-right font-black text-rose-600">' + Number(material.receivedQty || 0) + '</td>' +
            '</tr>';
          }).join('');
          if (!materialRows) materialRows = '<tr><td colspan="6" class="p-5 text-center text-slate-400">No linked received materials.</td></tr>';

          Swal.fire({
            title: 'Close Production Job',
            width: 1050,
            showCancelButton: true,
            confirmButtonText: 'Update Stock & Close',
            confirmButtonColor: '#059669',
            html: '<div class="text-left space-y-4">' +
              '<div class="grid grid-cols-1 md:grid-cols-3 gap-3 bg-indigo-50 dark:bg-indigo-950/30 border border-indigo-100 dark:border-indigo-900 rounded-xl p-4 text-sm">' +
                '<div><span class="text-[10px] uppercase font-extrabold text-slate-500">Production ID</span><div class="font-mono font-bold break-all">' + escapeHtmlSafe(job.productionId) + '</div></div>' +
                '<div><span class="text-[10px] uppercase font-extrabold text-slate-500">Order No</span><div class="font-bold">' + escapeHtmlSafe(job.orderNo) + '</div></div>' +
                '<div><span class="text-[10px] uppercase font-extrabold text-slate-500">Planned Qty</span><div class="font-black text-indigo-600">' + Number(job.plannedQty || 0) + ' ' + escapeHtmlSafe(job.uom || '') + '</div></div>' +
                '<div class="md:col-span-3"><span class="text-[10px] uppercase font-extrabold text-slate-500">Product</span><div class="font-bold">' + escapeHtmlSafe(job.productName) + '</div><div class="font-mono text-[10px] text-slate-500 break-all">' + escapeHtmlSafe(job.productId) + '</div></div>' +
              '</div>' +
              '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' +
                '<div><label class="block text-xs font-extrabold uppercase text-slate-500 mb-1">Final Produced Qty *</label><input id="production-final-qty" type="number" min="0.0001" step="any" value="' + Number(job.plannedQty || 0) + '" class="form-input-styled bg-white dark:bg-slate-900 font-bold"></div>' +
                '<div><label class="block text-xs font-extrabold uppercase text-slate-500 mb-1">Closing Remarks</label><input id="production-closing-remarks" type="text" class="form-input-styled bg-white dark:bg-slate-900" placeholder="Optional remarks"></div>' +
              '</div>' +
              '<div><div class="font-black text-slate-900 dark:text-white">Received Material Reconciliation</div><div class="text-xs text-slate-500">Used Qty production stock se deduct hogi. Return Qty target warehouse ko approval ke liye jayegi aur warehouse approve karne ke baad hi stock mein add hogi.</div></div>' +
              '<div class="overflow-x-auto"><table class="w-full min-w-[760px] text-xs border-collapse"><thead><tr class="bg-slate-100 dark:bg-slate-800"><th class="border border-slate-300 dark:border-slate-700 px-2 py-2 text-left">Material</th><th class="border border-slate-300 dark:border-slate-700 px-2 py-2">Return To</th><th class="border border-slate-300 dark:border-slate-700 px-2 py-2">Received Qty</th><th class="border border-slate-300 dark:border-slate-700 px-2 py-2">Return Qty</th><th class="border border-slate-300 dark:border-slate-700 px-2 py-2">Return Reason</th><th class="border border-slate-300 dark:border-slate-700 px-2 py-2">Used Qty</th></tr></thead><tbody>' + materialRows + '</tbody></table></div>' +
            '</div>',
            didOpen: function() {
              $(Swal.getHtmlContainer()).on('input', '.production-returned-qty', function() {
                var $row = $(this).closest('.production-close-material-row');
                var receivedQty = Number($row.attr('data-received-qty') || 0);
                var returnedQty = Number($(this).val() || 0);
                $row.find('.production-used-qty').text(Math.max(0, receivedQty - returnedQty));
              });
            },
            preConfirm: function() {
              var finalQty = Number($('#production-final-qty').val());
              var returnItems = [];
              var invalidReturn = false;
              $('.production-close-material-row').each(function() {
                var receivedQty = Number($(this).attr('data-received-qty') || 0);
                var returnedQty = Number($(this).find('.production-returned-qty').val() || 0);
                var returnReason = ($(this).find('.production-return-reason').val() || '').toString().trim();
                if (!isFinite(returnedQty) || returnedQty < 0 || returnedQty > receivedQty) invalidReturn = true;
                if (returnedQty > 0 && !returnReason) invalidReturn = true;
                returnItems.push({ requestId: ($(this).attr('data-request-id') || '').toString(), returnedQty: returnedQty, returnReason: returnReason });
              });
              if (!isFinite(finalQty) || finalQty <= 0) {
                Swal.showValidationMessage('Final produced quantity greater than zero honi chahiye.');
                return false;
              }
              if (invalidReturn) {
                Swal.showValidationMessage('Return Qty valid honi chahiye aur agar Return Qty > 0 hai to Return Reason mandatory hai.');
                return false;
              }
              return { productionId: productionId, finalProducedQty: finalQty, remarks: ($('#production-closing-remarks').val() || '').toString().trim(), returnItems: returnItems };
            }
          }).then(function(result) {
            if (!result.isConfirmed) return;
            showLoading(true);
            google.script.run
              .withSuccessHandler(function(response) {
                showLoading(false);
                Swal.fire('Production Closed', response.message, 'success');
                loadProductionTrackingPanel();
              })
              .withFailureHandler(onFailure)
              .closeProductionJob(result.value, currentUser);
          });
        })
        .withFailureHandler(onFailure)
        .getProductionJobDetails(productionId, currentUser);
    }

    function showProductionJobDetails(productionId) {
      showLoading(true);
      google.script.run
        .withSuccessHandler(function(data) {
          showLoading(false);
          var job = data.job || {};
          var items = data.materialClosureDetails || [];
          var rows = items.map(function(item) {
            return '<tr><td class="border border-slate-200 dark:border-slate-700 px-2 py-2"><div class="font-bold">' + escapeHtmlSafe(item.materialName || item.materialId || '') + '</div><div class="font-mono text-[10px] text-slate-500">' + escapeHtmlSafe(item.materialId || '') + '</div></td><td class="border border-slate-200 dark:border-slate-700 px-2 py-2 font-bold">' + escapeHtmlSafe(item.sourceWarehouse || '') + '</td><td class="border border-slate-200 dark:border-slate-700 px-2 py-2 text-right font-bold text-blue-600">' + Number(item.receivedQty || 0) + '</td><td class="border border-slate-200 dark:border-slate-700 px-2 py-2 text-right font-black text-rose-600">' + Number(item.usedQty || 0) + '</td><td class="border border-slate-200 dark:border-slate-700 px-2 py-2 text-right font-black text-emerald-600">' + Number(item.returnedQty || 0) + '</td></tr>';
          }).join('');
          Swal.fire({
            title: 'Production Closing Details',
            width: 950,
            confirmButtonText: 'Close',
            html: '<div class="text-left space-y-4">' +
              '<div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-4">' +
                '<div><b>Production ID</b><div class="font-mono text-xs break-all">' + escapeHtmlSafe(job.productionId || '') + '</div></div>' +
                '<div><b>Order No</b><div>' + escapeHtmlSafe(job.orderNo || '') + '</div></div>' +
                '<div><b>Status</b><div class="text-emerald-600 font-black">' + escapeHtmlSafe(job.status || '') + '</div></div>' +
                '<div class="md:col-span-2"><b>Product</b><div>' + escapeHtmlSafe(job.productName || '') + '</div><div class="font-mono text-[10px] text-slate-500 break-all">' + escapeHtmlSafe(job.productId || '') + '</div></div>' +
                '<div><b>Quantity</b><div>Planned: ' + Number(job.plannedQty || 0) + '<br>Final: <span class="text-emerald-600 font-black">' + Number(job.finalQty || 0) + '</span></div></div>' +
                '<div><b>Started</b><div>' + escapeHtmlSafe(job.startDate || '') + '<br>' + escapeHtmlSafe(job.startedBy || '') + '</div></div>' +
                '<div><b>Closed</b><div>' + escapeHtmlSafe(job.closingDate || '') + '<br>' + escapeHtmlSafe(job.closedBy || '') + '</div></div>' +
                '<div><b>Remarks</b><div>' + escapeHtmlSafe(job.remarks || '') + '</div></div>' +
              '</div>' +
              '<div class="overflow-x-auto"><table class="w-full text-xs border-collapse"><thead><tr class="bg-slate-100 dark:bg-slate-800"><th class="border border-slate-200 dark:border-slate-700 px-2 py-2">Material</th><th class="border border-slate-200 dark:border-slate-700 px-2 py-2">Source Warehouse</th><th class="border border-slate-200 dark:border-slate-700 px-2 py-2">Received Qty</th><th class="border border-slate-200 dark:border-slate-700 px-2 py-2">Used Qty</th><th class="border border-slate-200 dark:border-slate-700 px-2 py-2">Returned Qty</th></tr></thead><tbody>' + (rows || '<tr><td colspan="5" class="p-4 text-center text-slate-400">No material reconciliation details.</td></tr>') + '</tbody></table></div>' +
            '</div>'
          });
        })
        .withFailureHandler(onFailure)
        .getProductionJobDetails(productionId, currentUser);
    }

    $(document)
      .off('click.productionTracking', '#production-load-order-btn')
      .on('click.productionTracking', '#production-load-order-btn', loadSelectedSalesOrderProducts)
      .off('change.productionTracking', '#production-order-select')
      .on('change.productionTracking', '#production-order-select', function() {
        if ($(this).val()) loadSelectedSalesOrderProducts();
      })
      .off('click.productionTracking', '#production-fetch-selected-details-btn')
      .on('click.productionTracking', '#production-fetch-selected-details-btn', fetchSelectedProductionDetails)
      .off('click.productionTracking', '#production-close-requirement-sheet-btn')
      .on('click.productionTracking', '#production-close-requirement-sheet-btn', function() {
        $('#production-requirement-sheet').addClass('hidden');
        $('#production-requirement-excel-body').empty();
      })
      .off('change.productionTracking', '.production-requirement-source-wh')
      .on('change.productionTracking', '.production-requirement-source-wh', function() {
        refreshProductionRequirementRow($(this).closest('.production-requirement-excel-row'));
      })
      .off('click.productionTracking', '.production-bulk-material-btn')
      .on('click.productionTracking', '.production-bulk-material-btn', function() {
        openProductionBulkMaterialSelector($(this).closest('.production-requirement-excel-row'));
      })
      .off('click.productionTracking', '#production-send-all-material-requests-btn')
      .on('click.productionTracking', '#production-send-all-material-requests-btn', sendAllProductionMaterialRequests)
      .off('click.productionTracking', '#production-refresh-panel-btn')
      .on('click.productionTracking', '#production-refresh-panel-btn', loadProductionTrackingPanel)
      .off('click.productionTracking', '.production-close-job-btn')
      .on('click.productionTracking', '.production-close-job-btn', function() { showProductionClosingPopup($(this).attr('data-production-id')); })
      .off('click.productionTracking', '.production-view-job-btn')
      .on('click.productionTracking', '.production-view-job-btn', function() { showProductionJobDetails($(this).attr('data-production-id')); });



    // Warehouse verification actions for Production Material Returns.
    $(document)
      .off('click.productionReturnApproval', '.approve-production-return-btn')
      .on('click.productionReturnApproval', '.approve-production-return-btn', function() {
        var returnId = ($(this).attr('data-return-id') || '').toString().trim();
        if (!returnId) return;
        Swal.fire({
          title: 'Approve Production Return?',
          icon: 'question',
          html: '<div class="text-left"><p class="text-sm text-slate-600 dark:text-slate-300 mb-3">Confirm only after physically checking the returned material and return reason.</p><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Warehouse Remarks (Optional)</label><textarea id="warehouse-return-approve-remarks" rows="3" class="form-input-styled bg-white dark:bg-slate-900" placeholder="Physical condition / verification note"></textarea></div>',
          showCancelButton: true,
          confirmButtonText: 'Approve & Add Stock',
          confirmButtonColor: '#059669',
          preConfirm: function() {
            return ($('#warehouse-return-approve-remarks').val() || '').toString().trim();
          }
        }).then(function(result) {
          if (!result.isConfirmed) return;
          showLoading(true);
          google.script.run
            .withSuccessHandler(function(res) {
              showLoading(false);
              Swal.fire('Return Approved', res.message, 'success').then(function() { loadDashboardData(true); });
            })
            .withFailureHandler(onFailure)
            .approveProductionReturn(returnId, result.value || '', currentUser);
        });
      })
      .off('click.productionReturnApproval', '.reject-production-return-btn')
      .on('click.productionReturnApproval', '.reject-production-return-btn', function() {
        var returnId = ($(this).attr('data-return-id') || '').toString().trim();
        if (!returnId) return;
        Swal.fire({
          title: 'Reject Production Return?',
          icon: 'warning',
          html: '<div class="text-left"><p class="text-sm text-slate-600 dark:text-slate-300 mb-3">Rejected material will not be added to warehouse stock. Quantity will be restored to Production Inward-Staging.</p><label class="block text-xs font-bold uppercase text-rose-600 mb-1">Rejection Reason *</label><textarea id="warehouse-return-reject-reason" rows="3" class="form-input-styled bg-white dark:bg-slate-900" placeholder="Why is this return not acceptable?"></textarea></div>',
          showCancelButton: true,
          confirmButtonText: 'Reject Return',
          confirmButtonColor: '#e11d48',
          preConfirm: function() {
            var reason = ($('#warehouse-return-reject-reason').val() || '').toString().trim();
            if (!reason) {
              Swal.showValidationMessage('Warehouse rejection reason is required.');
              return false;
            }
            return reason;
          }
        }).then(function(result) {
          if (!result.isConfirmed) return;
          showLoading(true);
          google.script.run
            .withSuccessHandler(function(res) {
              showLoading(false);
              Swal.fire('Return Rejected', res.message, 'success').then(function() { loadDashboardData(true); });
            })
            .withFailureHandler(onFailure)
            .rejectProductionReturn(returnId, result.value, currentUser);
        });
      });
</script>
