<script>
// --- COMPACT AUDIT STAMP FORMATTER FOR TABLES ---
    function formatCompactAuditStamp(val) {
      // Never fabricate an audit value. Blank backend value stays blank.
      if (val === null || val === undefined || val === '') return '';
      var raw = val.toString().trim();
      if (!raw) return '';

      var parts = raw.split('//').map(function(x) { return (x || '').trim(); });
      if (parts.length < 4) return escapeHtmlSafe(raw);

      var name = parts[0] || '';
      var wh = normalizeWarehouseId(parts[1] || '');
      var date = parts[2] || '';
      var time = parts[3] || '';

      // Clean historical duplicate warehouse text without dynamic RegExp.
      // This avoids browser/runtime regex parsing failures in Apps Script HTMLService.
      // Example: "W1 - Kiranpal W1 (Delhi)//W1//..." -> "Kiranpal (Delhi) · W1 · ..."
      if (wh) {
        var trimmedName = name.trim();
        var upperName = trimmedName.toUpperCase();
        var upperWh = wh.toUpperCase();

        // Remove a leading warehouse marker such as "W1 - " or "W1: ".
        if (upperName.indexOf(upperWh) === 0) {
          var afterLead = trimmedName.substring(wh.length).trim();
          if (afterLead.charAt(0) === '-' || afterLead.charAt(0) === ':') {
            trimmedName = afterLead.substring(1).trim();
          }
        }

        // Remove the repeated warehouse token immediately before a location bracket
        // or at the end, e.g. "Kiranpal W1 (Delhi)" -> "Kiranpal (Delhi)".
        var tokens = trimmedName.split(/\s+/);
        var cleaned = [];
        for (var ti = 0; ti < tokens.length; ti++) {
          var token = tokens[ti];
          var nextToken = ti + 1 < tokens.length ? tokens[ti + 1] : '';
          var isWarehouseToken = token.toUpperCase() === upperWh;
          var beforeLocation = nextToken && nextToken.charAt(0) === '(';
          var atEnd = ti === tokens.length - 1;
          if (isWarehouseToken && (beforeLocation || atEnd)) continue;
          cleaned.push(token);
        }
        name = cleaned.join(' ').trim();
      }
      name = name.split(/\s+/).join(' ').trim();

      return escapeHtmlSafe(name) + (wh ? ' · ' + escapeHtmlSafe(wh) : '') +
        (date ? ' · ' + escapeHtmlSafe(date) : '') + (time ? ' ' + escapeHtmlSafe(time) : '');
    }

    function normalizeWarehouseId(id) {
      if (!id) return "";
      var val = id.toString().trim().toUpperCase();
      return val.replace(/^(WH|W)0*(\d+)/, "W$2");
    }

    function cleanUom(uomVal) {
      if (!uomVal) return "";
      var str = uomVal.toString().trim();
      var upper = str.toUpperCase();
      if (upper === "N/A" || upper === "NULL" || upper === "UNDEFINED" || upper === "NONE") {
        return "";
      }
      return str;
    }

    function getAuditUserName() {
      if (!currentUser) return "System";
      var wh = currentUser.warehouseId ? currentUser.warehouseId : "HQ";
      return wh + " - " + currentUser.name;
    }

    var safeStorage = {
      getItem: function(key) {
        try {
          return localStorage.getItem(key);
        } catch (e) {
          console.warn("Storage access blocked by browser security rules.", e);
          return null;
        }
      },
      setItem: function(key, val) {
        try {
          localStorage.setItem(key, val);
        } catch (e) {
          console.warn("Storage write blocked by browser security rules.", e);
        }
      },
      removeItem: function(key) {
        try {
          localStorage.removeItem(key);
        } catch (e) {
          console.warn("Storage delete blocked by browser security rules.", e);
        }
      }
    };

    function safeSelect2Destroy(selector) {
      var $el = $(selector);
      if ($el.length && ($el.hasClass("select2-hidden-accessible") || $el.data('select2'))) {
        $el.select2('destroy');
      }
    }

    // --- SAFE THIRD-PARTY UI HELPERS ---
    // Render all <i data-lucide="..."> icons without allowing a CDN failure
    // to break the rest of the application.
    var lucideFallbackRequested = false;
    var lucideRetryTimer = null;

    var lucideRenderQueued = false;
    function safeCreateIcons() {
      try {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          if (lucideRenderQueued) return true;
          lucideRenderQueued = true;
          var runIcons = function() {
            lucideRenderQueued = false;
            try {
              window.lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
            } catch (iconErr) {
              console.warn('Lucide render skipped:', iconErr);
            }
          };
          if (window.requestAnimationFrame) window.requestAnimationFrame(runIcons);
          else setTimeout(runIcons, 30);
          return true;
        }

        // If the primary CDN was blocked/slow, inject the fallback only once.
        if (!lucideFallbackRequested) {
          lucideFallbackRequested = true;

          var fallback = document.createElement('script');
          fallback.src = 'https://unpkg.com/lucide@latest/dist/umd/lucide.min.js';
          fallback.async = true;

          fallback.onload = function () {
            try {
              if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons({
                  attrs: {
                    'aria-hidden': 'true'
                  }
                });
              }
            } catch (e) {
              console.warn('Lucide fallback rendering failed:', e);
            }
          };

          fallback.onerror = function () {
            console.warn('Both Lucide CDNs are unavailable. App functionality is preserved.');
          };

          document.head.appendChild(fallback);
        }

        // A delayed retry also covers slow CDN initialization.
        if (!lucideRetryTimer) {
          lucideRetryTimer = setTimeout(function () {
            lucideRetryTimer = null;
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
              try {
                window.lucide.createIcons({
                  attrs: {
                    'aria-hidden': 'true'
                  }
                });
              } catch (e) {
                console.warn('Delayed Lucide render failed:', e);
              }
            }
          }, 500);
        }

        return false;
      } catch (err) {
        console.warn('Lucide icon rendering skipped:', err);
        return false;
      }
    }

    // Make the helper globally reachable for CDN onload handlers.
    window.safeCreateIcons = safeCreateIcons;


    // Automatically render Lucide icons added later by tables, popups and AJAX/UI refreshes.
    var lucideMutationQueued = false;
    var lucideObserver = new MutationObserver(function (mutations) {
      var needsRender = false;

      for (var i = 0; i < mutations.length && !needsRender; i++) {
        var mutation = mutations[i];

        if (mutation.type === 'childList' && mutation.addedNodes && mutation.addedNodes.length) {
          for (var j = 0; j < mutation.addedNodes.length; j++) {
            var node = mutation.addedNodes[j];
            if (node.nodeType !== 1) continue;

            if ((node.matches && node.matches('[data-lucide]')) ||
                (node.querySelector && node.querySelector('[data-lucide]'))) {
              needsRender = true;
              break;
            }
          }
        }

      }

      if (needsRender && !lucideMutationQueued) {
        lucideMutationQueued = true;
        requestAnimationFrame(function () {
          lucideMutationQueued = false;
          safeCreateIcons();
        });
      }
    });

    lucideObserver.observe(document.documentElement, {
      childList: true,
      subtree: true
    });


    // === PERFORMANCE LAYER (NO FEATURE/LOGIC REMOVAL) ===
    var PERF_CACHE_TTL = 60000; // 60 seconds: avoid repeated dashboard reloads while keeping data reasonably fresh.
    var perfCache = {
      dashboard: { ts: 0, data: null, userKey: '' },
      stockReport: { ts: 0, data: null, userKey: '' },
      receivingHistory: { ts: 0, data: null, userKey: '' },
      transferHistory: { ts: 0, data: null, userKey: '' }
    };
    var perfInFlight = {
      dashboard: false,
      dropdowns: false
    };

    function getPerfUserKey() {
      if (!currentUser) return '';
      return [
        currentUser.username || '',
        currentUser.role || '',
        currentUser.warehouseId || ''
      ].join('|');
    }

    function invalidatePerfCaches() {
      Object.keys(perfCache).forEach(function(key) {
        perfCache[key].ts = 0;
        perfCache[key].data = null;
        perfCache[key].userKey = '';
      });
    }

    function getCachedViewData_(key) {
      var bucket = perfCache[key];
      if (!bucket || !bucket.data) return null;
      if (bucket.userKey !== getPerfUserKey()) return null;
      if ((Date.now() - bucket.ts) >= PERF_CACHE_TTL) return null;
      return bucket.data;
    }

    function setCachedViewData_(key, data) {
      if (!perfCache[key]) return;
      perfCache[key] = { ts: Date.now(), data: data, userKey: getPerfUserKey() };
    }

    var currentUser = null;
    var tableInstances = {};
    var globalLists = { warehouses: [], products: [], vendorCodes: [], rejectReasons: [] };
    var originalPlannerData = [];
    var plannerDisplayedData = [];
    var plannerActiveTab = 'pending';
    var selectedPlannerUids = {};
    // Persist Multi-GRN selections across DataTable pages; no artificial 10-row page limit.
    var selectedWarehousePlanKeys = {};
    // Current Warehouse receiving rows shown after applied filters. Used so Multi-GRN Select All stays inside the filtered result only.
    var currentWarehouseVisibleReceipts = [];
    var originalWarehouseReceipts = []; 
    var myProductionStockMap = {}; 
    var LOW_STOCK_THRESHOLD = 10;
    
    var plannerDataMap = {};
    var warehousePlanMap = {};

    // GRN FIX: Never key a receiving item by Plan_ID alone. Historical duplicate
    // Plan_ID values can exist, so use Plan + PO + Product as the browser-side key.
    function getWarehousePlanKey(planOrPlanId, poId, productId) {
      if (planOrPlanId && typeof planOrPlanId === 'object') {
        poId = planOrPlanId.poId;
        productId = planOrPlanId.productId;
        planOrPlanId = planOrPlanId.planId;
      }
      return [planOrPlanId, poId, productId].map(function(v) {
        return String(v || '').trim().toUpperCase();
      }).join('___');
    }

    // Keep warehouse receiving row keys safe inside HTML data-* attributes.
    // Product/PO codes may contain quotes or other special characters; raw keys can
    // get truncated by the browser and make checked Multi-GRN rows look unselected.
    function encodeWarehousePlanKeyAttr(key) {
      return encodeURIComponent(String(key || ''));
    }
    function decodeWarehousePlanKeyAttr(value) {
      try { return decodeURIComponent(String(value || '')); }
      catch (e) { return String(value || ''); }
    }

    var sourceWarehouseStockMap = {}; 
    var imsPageFilterActive = false;
    
    function applyThemeMode(mode) {
      var dark = mode === 'dark';
      document.documentElement.classList.toggle('dark', dark);
      document.body && document.body.classList.toggle('ims-dark-active', dark);
      safeStorage.setItem('ims_theme', dark ? 'dark' : 'light');
      var icon = document.getElementById('themeToggleIcon');
      if (icon) icon.setAttribute('data-lucide', dark ? 'sun' : 'moon');
      var btn = document.getElementById('themeToggleBtn');
      if (btn) {
        btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
        btn.title = dark ? 'Switch to Light Theme' : 'Switch to Dark Theme';
      }
      safeCreateIcons();
    }

    function refreshCurrentScreen() {
      invalidatePerfCaches();
      var visibleEl = document.querySelector('#viewsContainer .view:not(.hidden)');
      var activeNav = document.querySelector('.nav-link.active');
      var visible = (visibleEl && visibleEl.id) || (activeNav && activeNav.getAttribute('data-view')) || 'dashboardView';
      var btn = document.getElementById('refreshDataBtn');
      if (btn) {
        btn.disabled = true;
        btn.classList.add('ims-refreshing');
      }
      showLoading(true);
      try {
        if (visible === 'dashboardView') loadDashboardData(true);
        else if (visible === 'stockReportView') loadStockReport();
        else if (visible === 'grnHistoryView') loadReceivingHistoryData();
        else if (visible === 'transferHistoryView') loadTransferHistoryData();
        else if (visible === 'warehouseManagerView') loadManagerData();
        else if (visible === 'warehouseMgmtView') loadWarehouseMgmtData();
        else if (visible === 'qcPendingView' || visible === 'qcHistoryView') loadQualityDashboardData();
        else if (visible === 'purchasePanelView' || visible === 'purchaseHistoryView') loadPurchasePanelData();
        else if (typeof setView === 'function') setView(visible);
        else window.location.reload();
      } catch (err) {
        console.error('[IMS REFRESH ERROR]', err);
        showLoading(false);
        if (window.Swal) Swal.fire('Refresh Failed', err && err.message ? err.message : 'Unable to refresh this screen.', 'error');
      } finally {
        setTimeout(function(){
          if (btn) {
            btn.disabled = false;
            btn.classList.remove('ims-refreshing');
          }
        }, 900);
      }
    }

    // Expose stable header actions. Buttons call these directly, so dynamic view
    // rendering or jQuery rebinding cannot break the header controls.
    window.imsToggleTheme = function(event) {
      if (event) { event.preventDefault(); event.stopPropagation(); }
      applyThemeMode(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
      return false;
    };
    window.imsRefreshNow = function(event) {
      if (event) { event.preventDefault(); event.stopPropagation(); }
      refreshCurrentScreen();
      return false;
    };
    window.applyThemeMode = applyThemeMode;
    window.refreshCurrentScreen = refreshCurrentScreen;

    $(document).ready(function () {
      safeCreateIcons();
      
      var savedTheme = safeStorage.getItem('ims_theme') || 'light';
      applyThemeMode(savedTheme === 'dark' ? 'dark' : 'light');
      
      // Bind critical authentication controls BEFORE restoring a saved session.
      // This ensures login/logout remain usable even if dashboard initialization throws.
      $('#login-form').off('submit.ims').on('submit.ims', handleLogin);
      $('#logoutButton').off('click.ims').on('click.ims', handleLogout);

      var savedSession = safeStorage.getItem('ims_user_session');
      if (savedSession) {
        try {
          var userObj = JSON.parse(savedSession);
          if (!userObj || !userObj.role) throw new Error('Invalid saved session');
          onLoginSuccess(userObj);
        } catch(e) {
          console.warn('Saved session restore failed:', e);
          safeStorage.removeItem('ims_user_session');
          currentUser = null;
          setView('loginView');
        }
      } else {
        setView('loginView');
      }

          showStockAdjustmentPopup(pId, wId);

      $(document).on('click', '.warehouse-transfer-stock-btn', function() {

          var productName = $(this).attr('data-product-name') || productId;

      });
      
      $(document).on('click', '#btn-add-req-row', addRequestRow);
      $(document).on('submit', '#request-material-multi-form', handleMultiRequestSubmit);
      $(document).on('submit', '#log-production-form', handleProductionSubmit);
      $(document).on('click', '#add-allocation-btn-popup', addAllocationRowPopup);
      
      $(document).on('input change keyup', '.plan-qty-input-popup', calculateAllocatedNowPopup);
      
      $(document).on('click', '.delete-allocation-btn', function() { 
          if ($('.allocation-row-popup').length > 1) { 
              $(this).closest('.allocation-row-popup').remove(); 
              calculateAllocatedNowPopup(); 
          } else { 
              Swal.fire({toast: true, position: 'top-end', icon: 'info', title: 'Minimum allocation is 1 row.', showConfirmButton: false, timer: 1500}); 
          } 
      });

      // --- DOWNLOAD RECEIVING PLAN PDF BUTTON HANDLER ---
      $(document).on('click', '#download-wh-plan-pdf-btn', function() {
          var targetWh = (currentUser && currentUser.warehouseId) ? currentUser.warehouseId : "W1";
          showLoading(true);

          google.script.run
              .withSuccessHandler(function(base64Pdf) {
                  showLoading(false);
                  var link = document.createElement('a');
                  link.href = 'data:application/pdf;base64,' + base64Pdf;
                  link.download = 'Receiving_Plan_' + targetWh + '_' + new Date().toISOString().split('T')[0] + '.pdf';
                  document.body.appendChild(link);
                  link.click();
                  document.body.removeChild(link);

                  var isDark = $('html').hasClass('dark');
                  Swal.fire({
                      toast: true,
                      position: 'top-end',
                      icon: 'success',
                      title: 'Receiving Plan PDF Downloaded!',
                      showConfirmButton: false,
                      timer: 2500,
                      background: isDark ? '#111827' : '#ffffff',
                      color: isDark ? '#f8fafc' : '#1e293b'
                  });
              })
              .withFailureHandler(onFailure)
              .generateReceivingPlanPdf(targetWh, currentUser);
      });

      // --- DOWNLOAD RECEIVING PLAN EXCEL BUTTON HANDLER ---
      $(document).on('click', '#download-wh-plan-excel-btn', function() {
          var targetWh = (currentUser && currentUser.warehouseId) ? currentUser.warehouseId : "ALL";
          showLoading(true);
          google.script.run
              .withSuccessHandler(function(result) {
                  showLoading(false);
                  downloadGeneratedFile(result, 'Receiving Plan Excel');
              })
              .withFailureHandler(onFailure)
              .downloadReceivingPlanExcel(targetWh, currentUser);
      });

      function downloadGeneratedFile(result, label) {
          if (!result || !result.base64) {
              onFailure(new Error((label || 'Download') + ' could not be generated.'));
              return;
          }
          var link = document.createElement('a');
          link.href = 'data:' + result.mimeType + ';base64,' + result.base64;
          link.download = result.fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          var isDark = $('html').hasClass('dark');
          Swal.fire({
              toast: true, position: 'top-end', icon: 'success',
              title: (label || 'File') + ' Downloaded!', showConfirmButton: false, timer: 2500,
              background: isDark ? '#111827' : '#ffffff', color: isDark ? '#f8fafc' : '#1e293b'
          });
      }

      // --- STOCK SHEET + RECEIVED MATERIAL DOWNLOADS (PDF / EXCEL) ---
      function downloadWarehouseReport(reportType, format) {
          var targetWh = (currentUser && currentUser.warehouseId) ? currentUser.warehouseId : "ALL";
          var normalizedFormat = (format || 'pdf').toLowerCase();
          showLoading(true);

          var runner = google.script.run
              .withSuccessHandler(function(result) {
                  showLoading(false);
                  if (!result || !result.base64) {
                      onFailure(new Error('Download file could not be generated.'));
                      return;
                  }

                  var link = document.createElement('a');
                  link.href = 'data:' + result.mimeType + ';base64,' + result.base64;
                  link.download = result.fileName;
                  document.body.appendChild(link);
                  link.click();
                  document.body.removeChild(link);

                  var isDark = $('html').hasClass('dark');
                  Swal.fire({
                      toast: true,
                      position: 'top-end',
                      icon: 'success',
                      title: result.fileName + ' Downloaded!',
                      showConfirmButton: false,
                      timer: 2500,
                      background: isDark ? '#111827' : '#ffffff',
                      color: isDark ? '#f8fafc' : '#1e293b'
                  });
              })
              .withFailureHandler(onFailure);

          if (reportType === 'stock') {
              runner.downloadStockSheet(targetWh, normalizedFormat, currentUser);
          } else {
              runner.downloadReceivedMaterial(targetWh, normalizedFormat, currentUser);
          }
      }

      $(document).on('click', '.download-stock-sheet-btn', function() {
          downloadWarehouseReport('stock', $(this).data('format'));
      });

      $(document).on('click', '.download-planner-po-btn', function() {
          var format = ($(this).data('format') || 'pdf').toString().toLowerCase();
          var rows = (plannerDisplayedData || []).map(function(po) {

              po.poId || '', po.orderNo || '', po.productId || '', po.itemDescription || '',
              cleanUom(po.uom), po.buyerCode || '', po.salesPerson || '', po.purchasePerson || '',
              po.vendorName || '', po.date || '', po.location || '', Number(po.unplannedQty || 0),
              po.lastEditStatus || ''

          if (!rows.length) { Swal.fire('No Data', 'There are no planner rows to export in the current tab/filter.', 'info'); return; }

            .withSuccessHandler(function(result) { showLoading(false); downloadGeneratedFile(result, 'Planner Purchase Orders ' + (format === 'xlsx' ? 'Excel' : 'PDF')); })

      $(document).on('click', '#download-approved-transfers-excel-btn', function() {

      $(document).on('click', '#btn-open-multi-grn', function() {
        var selectedPlans = [];
        var seen = {};

        // Manual selection is ALWAYS valid; filters are optional.
        // Resolve checked DOM rows immediately against the current rendered map first.
        // This makes the button work even when the user manually checks rows after any filter.
        $('.wh-plan-checkbox:checked').each(function() {
          var planKey = decodeWarehousePlanKeyAttr($(this).attr('data-plan-key'));
          if (!planKey) return;
          selectedWarehousePlanKeys[planKey] = true;
          var currentPlan = warehousePlanMap[planKey];
          if (currentPlan && !seen[planKey]) {
            selectedPlans.push(currentPlan);
            seen[planKey] = true;
          }
        });

        // Add selections preserved from other DataTable pages by resolving against the
        // full receiving dataset. No filter is required and there is no page-size limit.
        (originalWarehouseReceipts || []).forEach(function(plan) {
          var planKey = getWarehousePlanKey(plan);
          if (selectedWarehousePlanKeys[planKey] && !seen[planKey]) {
            selectedPlans.push(plan);
            seen[planKey] = true;
          }
        });

        // Final fallback for any selected current-filter row.
        Object.keys(selectedWarehousePlanKeys).forEach(function(planKey) {
          if (!selectedWarehousePlanKeys[planKey] || seen[planKey]) return;
          var plan = warehousePlanMap[planKey];
          if (plan) {
            selectedPlans.push(plan);
            seen[planKey] = true;
          }
        });

        if (selectedPlans.length === 0) {
          Swal.fire('No Items Selected', 'Multi-GRN ke liye checkbox se kam se kam ek receiving item select karein. Filter lagana zaroori nahi hai.', 'info');
          return;
        }

        showMultiReceiveGoodsPopup(selectedPlans);
      });

        didOpen: function() {
          safeCreateIcons();

          $('.mgrn-item-card').each(function() {
            var card = $(this);
            var balance = Number(card.data('balance'));
            var accInput = card.find('.mgrn-acc-qty');
            var rejInput = card.find('.mgrn-rej-qty');
            var noticeBox = card.find('.mgrn-partial-notice-box');
            var rejContainer = card.find('.mgrn-rejection-container');

            function updateItemCalculation() {
              var acc = Number(accInput.val()) || 0;
              var rej = Number(rejInput.val()) || 0;
              var total = acc + rej;
              var remaining = balance - total;

              if (rej > 0) {
                rejContainer.removeClass('hidden');
              } else {
                rejContainer.addClass('hidden');
              }

              if (total > balance) {
                var extraQty = total - balance;
                Swal.resetValidationMessage();
                noticeBox.html(`
                  <div class="p-2.5 bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800 rounded-lg text-xs text-emerald-900 dark:text-emerald-300 flex justify-between items-center">
                    <span><strong>Extra Receipt Allowed:</strong> Receiving <strong>${total}</strong> against balance ${balance}.</span>
                    <span class="font-bold bg-emerald-100 dark:bg-emerald-900/60 px-2 py-0.5 rounded text-[11px]">+${extraQty} Extra</span>
                  </div>
                `).removeClass('hidden');
              } else if (remaining > 0 && total > 0) {
                Swal.resetValidationMessage();
                noticeBox.html(`
                  <div class="p-2.5 bg-amber-50 dark:bg-amber-955/30 border border-amber-200 dark:border-amber-800 rounded-lg text-xs text-amber-900 dark:text-amber-300 flex justify-between items-center">
                    <span>📦 <strong>Partial Receive:</strong> Receiving <strong>${total}</strong> out of ${balance}.</span>
                    <span class="font-bold bg-amber-100 dark:bg-amber-900/60 px-2 py-0.5 rounded text-[11px]">${remaining} Pending</span>
                  </div>
                `).removeClass('hidden');
              } else {
                Swal.resetValidationMessage();
                noticeBox.addClass('hidden').empty();
              }
            }

            accInput.add(rejInput).on('input change keyup', updateItemCalculation);
            
            card.find('.mgrn-rej-reason-select').on('change', function() {
              if ($(this).val() === 'Other') {
                card.find('.mgrn-rej-reason-text').removeClass('hidden').focus();
              } else {
                card.find('.mgrn-rej-reason-text').addClass('hidden');
              }
            });
          });
        },
        preConfirm: function() {
          var inv = $('#mgrn-invoice-no').val().trim();
          var gst = $('#grn-gst-invoice').val().trim();
          var bilty = $('#mgrn-bilty-no').val().trim();
          var truck = $('#mgrn-truck-no').val().trim();
          var dName = $('#mgrn-driver-name').val().trim();
          var dNo = $('#mgrn-driver-no').val().trim();

          if (!inv || !gst || !bilty || !truck || !dName || !dNo) {
            Swal.showValidationMessage('Kripya saare Cargo Transport Parameters fill karein.');
            return false;
          }

          var invoiceFile = $('#mgrn-invoice-file')[0].files[0];
          if (!invoiceFile) {
            Swal.showValidationMessage('Freight Invoice Image attach karna zaroori hai.');
            return false;
          }

          var processedItems = [];
          var hasError = false;

          $('.mgrn-item-card').each(function() {
            var card = $(this);
            var planId = String(card.attr('data-plan-id') || '').trim();
            var poId = String(card.attr('data-po-id') || '').trim();
            var productId = String(card.attr('data-product-id') || '').trim();
            var balance = Number(card.data('balance'));
            var acc = Number(card.find('.mgrn-acc-qty').val()) || 0;
            var rej = Number(card.find('.mgrn-rej-qty').val()) || 0;
            var bin = card.find('.mgrn-bin').val().trim() || "Inward-Staging";
            var rejReasonSel = card.find('.mgrn-rej-reason-select').val();
            var rejReasonText = card.find('.mgrn-rej-reason-text').val().trim();
            var rejReason = (rejReasonSel === 'Other') ? rejReasonText : rejReasonSel;

            if (rej > 0 && !rejReason) {
              Swal.showValidationMessage('Item ' + planId + ' ke liye Rejection Reason zaroori hai.');
              hasError = true;
              return false;
            }

            var origPlan = warehousePlanMap[getWarehousePlanKey(planId, poId, productId)] || {};

            processedItems.push({
              planId: planId,
              poId: poId || origPlan.poId || '',
              productId: productId || origPlan.productId || '',
              receivedQty: acc,
              rejectedQty: rej,
              storageLocation: bin,
              rejectionReason: rejReason || "OK",
              itemDescription: origPlan.itemDescription || origPlan.productId,
              uom: origPlan.uom || "Pcs",
              purchasePersonName: cleanDisplayVal(origPlan.purchasePersonName),
              purchaserName: cleanDisplayVal(origPlan.purchasePersonName),
              plannedBy: cleanDisplayVal(origPlan.plannedBy),
              plannerName: cleanDisplayVal(origPlan.plannedBy),
              orderNo: origPlan.orderNo || "",
              buyerCode: cleanDisplayVal(origPlan.buyerCode),
              vendorName: cleanDisplayVal(origPlan.vendorName),
              vendorCode: cleanDisplayVal(origPlan.vendorCode)
            });
          });

          if (hasError) return false;

          return new Promise(function(resolve) {
            var reader = new FileReader();
            reader.onload = function() {
              resolve({
                warehouseId: userWh,
                invoiceNo: inv,
                gstInvoice: gst,
                biltyNo: bilty,
                truckNo: truck,
                driverName: dName,
                driverNo: dNo,
                invoiceImage: reader.result,
                items: processedItems
              });
            };
            reader.readAsDataURL(invoiceFile);
          });
        }
      }).then(function(result) {
        if (result.isConfirmed) {
          showLoading(true);
          google.script.run
            .withSuccessHandler(function(res) {
              showLoading(false);
              selectedWarehousePlanKeys = {};
              $('#wh-select-all-plans').prop('checked', false);
              var isDark = $('html').hasClass('dark');
              var multiData = res.multiData || {};
              // Every line of one Multi-GRN is persisted with one common Receipt ID.
              // Printing by the saved ID guarantees one consolidated PDF for the whole batch.
              var savedMultiReceiptId = (res && (res.multiReceiptId || (multiData && multiData.multiReceiptId))) || '';

              Swal.fire({
                title: 'Multi-GRN Authorized Successfully!',
                text: res.message,
                icon: 'success',
                showCancelButton: true,
                confirmButtonText: '🖨️ Print / Save PDF',
                cancelButtonText: 'Close',
                confirmButtonColor: '#10b981', // Green Button
                cancelButtonColor: '#6b7280',  // Grey Button
                background: isDark ? '#111827' : '#ffffff',
                color: isDark ? '#f8fafc' : '#1e293b'
              }).then(function(alertResult) {
                if (alertResult.isConfirmed) {
                  if (savedMultiReceiptId) {
                    printGrnByReceiptId(savedMultiReceiptId);
                  } else {
                    onFailure(new Error('Multi-GRN was saved, but the common Receipt ID was not returned. Refresh Receiving History and use Reprint.'));
                  }
                }
                loadDashboardData();
              });
            })
            .withFailureHandler(onFailure)
            .submitMultiGoodsReceiving(result.value, currentUser);
        }
      });
    }

      if (currentUser && currentUser.role === 'Quality') {
        if (!['dashboardView', 'qcPendingView', 'qcHistoryView'].includes(viewName)) {
          viewName = 'dashboardView';
        }
      } else {
        if (!['dashboardView', 'stockReportView', 'requestMaterialView', 'logProductionView', 'warehouseMgmtView', 'warehouseManagerView', 'purchasePanelView', 'purchaseHistoryView', 'grnHistoryView', 'transferHistoryView'].includes(viewName)) {
          viewName = 'dashboardView';
        }
      }
      $('#viewsContainer .view').addClass('hidden');
      $('#' + viewName).removeClass('hidden');
      $('.nav-link').removeClass('active');
      $('.nav-link[data-view="' + viewName + '"]').addClass('active');
      
      var titleText = "Dashboard";
      if (currentUser && currentUser.role === 'Quality') {
        if (viewName === 'qcPendingView') {
          titleText = "Pending Inspections";
        } else if (viewName === 'qcHistoryView') {
          titleText = "Inspection History";

    function formatDateToYYYYMMDD(dateStr) {
        if (!dateStr || dateStr === 'N/A') return '';
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        var month = '' + (d.getMonth() + 1);
        var day = '' + d.getDate();
        var year = d.getFullYear();
        if (month.length < 2) month = '0' + month;
        if (day.length < 2) day = '0' + day;
        return [year, month, day].join('-');
    }

    function displayCompletedGrnTable(completedReceipts) {
        completedReceipts = completedReceipts || [];
        populateMultiPOFilter('#grn-filter-po', completedReceipts.map(function(row) { return row.poId; }));

        // One Multi-GRN stores the same Receipt ID on every received line.
        // Count those IDs only for display, so the existing sheet schema/data remains untouched.
        var receiptBatchCounts = {};
        completedReceipts.forEach(function(row) {
          var receiptKey = String((row && row.receiptId) || '').trim();
          if (!receiptKey) return;
          receiptBatchCounts[receiptKey] = (receiptBatchCounts[receiptKey] || 0) + 1;
        });

        var completedGrnsHtml = completedReceipts.map(function(row) {
            var actualPlanned = Number(row.plannedQty || 0);
            if (actualPlanned <= 0) {
                actualPlanned = Number(row.receivedQty || 0) + Number(row.rejectedQty || 0);
            }

            var receiptKey = String((row && row.receiptId) || '').trim();
            var batchItemCount = receiptBatchCounts[receiptKey] || 1;
            var isMultiGrn = batchItemCount > 1;
            var grnTypeBadge = isMultiGrn
              ? '<span class="inline-flex items-center whitespace-nowrap rounded-full border border-indigo-200 bg-indigo-50 px-2.5 py-1 text-[10px] font-extrabold uppercase tracking-wide text-indigo-700 dark:border-indigo-800 dark:bg-indigo-950/40 dark:text-indigo-300" title="These ' + batchItemCount + ' lines were received together under one common GRN">Multi GRN · ' + batchItemCount + ' Items</span>'
              : '<span class="inline-flex items-center whitespace-nowrap rounded-full border border-slate-200 bg-slate-50 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wide text-slate-600 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300">Single GRN</span>';

            return '<tr class="hover:bg-slate-100 dark:hover:bg-slate-800">' +
                '<td data-label="Receipt ID" class="font-mono text-xs font-semibold text-indigo-600 dark:text-indigo-404">' + row.receiptId + '</td>' +
                '<td data-label="GRN Type" class="text-xs">' + grnTypeBadge + '</td>' +
                '<td data-label="Date" class="text-xs text-slate-505">' + row.date + '</td>' +

    function deriveDepartmentFromRole(role) {
      var clean = String(role || '').trim().toLowerCase();
      if (clean === 'planner') return 'Planning';
      if (clean === 'purchase' || clean === 'purchaser') return 'Purchase';
      if (clean === 'warehouse' || clean === 'warehouse manager' || clean === 'warehousemanager') return 'Warehouse';
      if (clean === 'production') return 'Production';
      if (clean === 'quality' || clean === 'qc') return 'Quality';
      if (clean === 'accounts' || clean === 'account' || clean === 'demo1' || clean === 'finance') return 'Accounts';
      return 'Common';
    }

    function normalizeDepartmentName(department, role) {
      var value = String(department || '').trim();
      if (!value) return deriveDepartmentFromRole(role);

      var clean = value.toLowerCase();
      if (clean.indexOf('plan') !== -1) return 'Planning';
      if (clean.indexOf('purchase') !== -1 || clean.indexOf('procure') !== -1) return 'Purchase';
      if (clean.indexOf('warehouse') !== -1 || clean.indexOf('store') !== -1) return 'Warehouse';
      if (clean.indexOf('production') !== -1 || clean.indexOf('manufactur') !== -1) return 'Production';
      if (clean.indexOf('quality') !== -1 || clean === 'qc') return 'Quality';
      if (clean.indexOf('account') !== -1 || clean.indexOf('finance') !== -1) return 'Accounts';
      return value;
    }

    // Preserve table working position across write-success refreshes.
    // A user working on page 2 / 6 should remain on that page after an entry,
    // as long as that page still exists after the updated data is loaded.
    var imsDataTableState = window.imsDataTableState || {};
    window.imsDataTableState = imsDataTableState;

    function captureDataTableState_(tableId, dt) {
      if (!dt) return;
      try {
        var info = dt.page.info();
        imsDataTableState[tableId] = {
          page: info && Number.isFinite(info.page) ? info.page : 0,
          length: info && Number.isFinite(info.length) ? info.length : 10,
          search: dt.search ? (dt.search() || '') : '',
          order: dt.order ? dt.order() : []
        };
      } catch (_) {}
    }

    function restoreDataTableState_(tableId, dt) {
      if (!dt) return;
      var state = imsDataTableState[tableId];
      if (!state) return;
      try {
        if (state.length && dt.page && dt.page.len) dt.page.len(state.length);
        if (dt.search) dt.search(state.search || '');
        if (dt.order && Array.isArray(state.order)) dt.order(state.order);
        dt.draw(false);

        var info = dt.page.info();
        var lastPage = Math.max(0, (info.pages || 1) - 1);
        var wantedPage = Math.max(0, Math.min(Number(state.page) || 0, lastPage));
        if (dt.page) dt.page(wantedPage).draw('page');
      } catch (_) {}
    }

    function bindDataTableStateTracking_(tableId, $table, dt) {
      if (!$table || !$table.length || !dt) return;
      try {
        $table.off('.imsKeepPage').on('page.dt.imsKeepPage length.dt.imsKeepPage search.dt.imsKeepPage order.dt.imsKeepPage draw.dt.imsKeepPage', function() {
          captureDataTableState_(tableId, dt);
        });
      } catch (_) {}
      captureDataTableState_(tableId, dt);
    }

    function initOrUpdateDataTable(tableId, htmlRows, options) {
      var tableSelector = '#' + tableId;
      var $table = $(tableSelector);

      if (!$table.length) return;

      var defaultOpts = {
          responsive: false,
          pageLength: 10,
          searching: true,
          ordering: true,
          deferRender: true,
          autoWidth: false,
          language: { search: "_INPUT_", searchPlaceholder: "Search ledger...", emptyTable: "No matching records found." },
          layout: { topStart: 'search', topEnd: null, bottomStart: 'info', bottomEnd: 'paging' }
      };
      var mergedOpts = $.extend(true, {}, defaultOpts, options);

      // FAST PATH: preserve the existing DataTable instance only when the
      // current DOM header count still matches the initialized DataTable.
      if (window.jQuery && $.fn.DataTable && $.fn.DataTable.isDataTable(tableSelector)) {
        try {
          var dt = $table.DataTable();
          captureDataTableState_(tableId, dt);
          var domHeaderCount = $table.find('thead th').length;
          var dtColumnCount = dt.columns().count();
          if (domHeaderCount !== dtColumnCount) {
            dt.clear().destroy();
            $table.find('tbody').empty();
          } else {
          var tempBody = document.createElement('tbody');
          tempBody.innerHTML = htmlRows || '';
          var rowNodes = Array.prototype.slice.call(tempBody.children);

          dt.clear();
          if (rowNodes.length) {
            dt.rows.add(rowNodes);
          }
          if (options && Object.prototype.hasOwnProperty.call(options, 'order')) {
            try { dt.order(options.order || []); } catch (orderErr) {}
          }
          dt.draw(false);
          restoreDataTableState_(tableId, dt);
          bindDataTableStateTracking_(tableId, $table, dt);
          tableInstances[tableId] = dt;

          requestAnimationFrame(function() {
            try { dt.columns.adjust(); } catch (e) {}
            safeCreateIcons();
          });
          return;
          }
        } catch (e) {
          console.warn("Fast DataTable update fallback for " + tableId + ": ", e);
          try { $table.DataTable().clear().destroy(); } catch (_) {}
        }
      }

      $table.find('tbody').html(htmlRows || '');

      try {
          if ($.fn.DataTable) {
              tableInstances[tableId] = $table.DataTable(mergedOpts);
          } else {
              tableInstances[tableId] = new DataTable(tableSelector, mergedOpts);
          }
          restoreDataTableState_(tableId, tableInstances[tableId]);
          bindDataTableStateTracking_(tableId, $table, tableInstances[tableId]);
      } catch(e) {
          console.error("DataTables load error for " + tableId + ": ", e);
      }

      requestAnimationFrame(function() {
          if (tableInstances[tableId]) {
              try { tableInstances[tableId].columns.adjust(); } catch (e) {}
          }
          safeCreateIcons();
      });
    }

    function loadDashboardData(forceRefresh) {
      if (!currentUser) {
        showLoading(false);
        return;
      }

      // Department Dashboard must follow the ACTIVE DEPARTMENT, not only the
      // login role. Example: a Planner-role user assigned to Accounts should
      // see the lightweight Accounts dashboard instead of triggering the
      // heavy Planner dashboard request. This also prevents the loading
      // overlay from being left visible while an irrelevant request runs.
      var effectiveDepartment = getEffectiveDashboardDepartment();
      if (effectiveDepartment === 'Accounts') {
        perfInFlight.dashboard = false;
        var accountsData = { role: 'Accounts', department: 'Accounts' };
        perfCache.dashboard = {
          ts: Date.now(),
          data: accountsData,
          userKey: getPerfUserKey()
        };
        try {
          populateDashboard(accountsData);
        } finally {
          showLoading(false);
        }
        return;
      }

      var now = Date.now();
      var userKey = getPerfUserKey();

      if (!forceRefresh &&
          perfCache.dashboard.data &&
          perfCache.dashboard.userKey === userKey &&
          (now - perfCache.dashboard.ts) < PERF_CACHE_TTL) {
        populateDashboard(perfCache.dashboard.data);
        return;
      }

      // If the same dashboard request is already running, do not send a duplicate Apps Script call.
      if (perfInFlight.dashboard && !forceRefresh) return;

      perfInFlight.dashboard = true;
      showLoading(true);

      google.script.run
        .withSuccessHandler(function(data) {
          perfInFlight.dashboard = false;
          perfCache.dashboard = {
            ts: Date.now(),
            data: data,
            userKey: getPerfUserKey()
          };
          populateDashboard(data);
        })
        .withFailureHandler(function(err) {
          perfInFlight.dashboard = false;
          onFailure(err);
        })
        .getDashboardData(currentUser);
    }

    function getProductNameForDashboardFilter(productId) {
      var pid = (productId || '').toString().trim();
      if (!pid) return '';
      var products = (globalLists && Array.isArray(globalLists.products)) ? globalLists.products : [];
      for (var i = 0; i < products.length; i++) {
        if ((products[i].id || '').toString().trim() === pid) return products[i].name || pid;
      }
      return pid;
    }

    function collectDashboardProductIds(data, roleKey) {
      var ids = [];
      function add(v) { v = (v || '').toString().trim(); if (v && ids.indexOf(v) === -1) ids.push(v); }
      data = data || {};
      if (roleKey === 'purchase') {
        (data.activePOs || []).forEach(function(x){ add(x.productId); });
        (data.pendingRejections || []).forEach(function(x){ add(x.productId); });
        (data.recentReceipts || []).forEach(function(x){ add(x.productId); });
      } else if (roleKey === 'production') {
        (data.incomingTransfers || []).forEach(function(x){ add(x.productId); });
        (data.myStock || []).forEach(function(x){ add(x.productId); });
        (data.productionRuns || []).forEach(function(x){ add(x.rawProductId); add(x.finishedProductId); });
      } else if (roleKey === 'quality') {
        (data.pendingInspections || []).forEach(function(x){ add(x.productId); });
        (data.inspectionHistory || []).forEach(function(x){ add(x.productId); });
      }
      return ids;
    }

    function populateRoleDashboardItemFilter(selector, productIds) {
      var $sel = $(selector);
      if (!$sel.length) return;
      var prev = $sel.val() || [];
      safeSelect2Destroy(selector);
      $sel.empty();
      (productIds || []).map(function(id) {
        return { id: id, name: getProductNameForDashboardFilter(id) };
      }).sort(function(a,b) { return a.name.localeCompare(b.name); }).forEach(function(item) {
        $sel.append('<option value="' + escapeAttr(item.id) + '">' + item.name + ' (' + item.id + ')</option>');
      });
      $sel.select2({ width: '100%', closeOnSelect: false, placeholder: $sel.attr('data-placeholder') || 'All Item Names' });
      $sel.val(prev.filter(function(v) { return (productIds || []).indexOf(v) !== -1; })).trigger('change.select2');
    }

    function applyRoleDashboardItemFilter($select) {
      var productIds = (($select && $select.val()) || []);
      var roleKey = (($select && $select.attr('data-role-filter')) || '').toString();
      var tableIds = roleKey === 'purchase'
        ? ['pur-dash-rejections-table', 'pur-dash-receipts-table', 'pur-dash-pos-table']
        : roleKey === 'production'
          ? ['prod-incoming-table', 'prod-stock-table', 'prod-runs-table']
          : roleKey === 'quality'
            ? ['qc-dashboard-pending-table', 'qc-dashboard-history-table']
            : [];
      tableIds.forEach(function(tableId) {
        var selector = '#' + tableId;
        if ($.fn.DataTable && $.fn.DataTable.isDataTable(selector)) {
          var escaped = productIds.map(function(v) { return $.fn.dataTable.util.escapeRegex(v); });
          $(selector).DataTable().search(escaped.length ? '(' + escaped.join('|') + ')' : '', true, false).draw();
        }
      });
    }

    function populateMultiPOFilter(selector, values) {
      var $select = $(selector);
      if (!$select.length) return;
      var previous = $select.val() || [];
      var unique = [...new Set((values || []).map(function(v) { return cleanDisplayVal(v); }).filter(Boolean))].sort();
      safeSelect2Destroy(selector);
      $select.empty();
      unique.forEach(function(value) { $select.append('<option value="' + escapeAttr(value) + '">' + escapeHtmlSafe(value) + '</option>'); });
      $select.select2({ width: '100%', closeOnSelect: false, placeholder: $select.attr('data-placeholder') || 'All PO IDs' });
      $select.val(previous.filter(function(v) { return unique.indexOf(v) !== -1; })).trigger('change.select2');
    }

    function applyMultiValueTableFilter(tableSelector, selectedValues) {
      imsPageFilterActive = (selectedValues || []).length > 0;
      if (!($.fn.DataTable && $.fn.DataTable.isDataTable(tableSelector))) return;
      var escaped = (selectedValues || []).map(function(v) { return $.fn.dataTable.util.escapeRegex(v); });
      $(tableSelector).DataTable().search(escaped.length ? '(' + escaped.join('|') + ')' : '', true, false).draw();
    }

    function populateWarehouseFilters(data) {
        var poIds = [...new Set(data.map(function(i) { return i.poId; }).filter(Boolean))]; 
        var orderNos = [...new Set(data.map(function(i) { return i.orderNo; }).filter(Boolean))];
        // Build Item Name options from the exact same value used by the receiving table/filter.
        // Keep Product ID as a safe fallback when an item description is blank.
        var itemNames = [...new Set(data.map(function(i) {
            return cleanDisplayVal(i.itemDescription || i.productName || i.productId);
        }).filter(Boolean))];
        var vendors = [...new Set(data.map(function(i) { return i.vendorName; }).filter(Boolean))];
        
        safeSelect2Destroy('#wh-filter-po');
        safeSelect2Destroy('#wh-filter-order');
        safeSelect2Destroy('#wh-filter-item');
        safeSelect2Destroy('#wh-filter-vendor');

        var previousPOs = $('#wh-filter-po').val() || [];
        var previousOrders = $('#wh-filter-order').val() || [];
        var previousItems = $('#wh-filter-item').val() || [];
        var previousVendors = $('#wh-filter-vendor').val() || [];
        var poSelect = $('#wh-filter-po').empty();
        poIds.sort().forEach(function(id) { poSelect.append('<option value="' + id + '">' + id + '</option>'); });
        
        var orderSelect = $('#wh-filter-order').empty();
        orderNos.sort().forEach(function(o) { orderSelect.append('<option value="' + o + '">' + o + '</option>'); });

        var itemSelect = $('#wh-filter-item').empty();
        // Use real DOM Option nodes for Item Description values. This avoids HTML/entity
        // mismatches for descriptions containing &, quotes, brackets or other symbols and
        // makes Select2 search-result clicks select the exact underlying description.
        itemNames.sort().forEach(function(item) {
            itemSelect.append(new Option(String(item), String(item), false, false));
        });

        var vendorSelect = $('#wh-filter-vendor').empty();
        vendors.sort().forEach(function(vendor) { vendorSelect.append('<option value="' + escapeAttr(vendor) + '">' + vendor + '</option>'); });
        
        $('#wh-filter-po').select2({ width: '100%', closeOnSelect: false, placeholder: 'All PO IDs' });
        $('#wh-filter-order').select2({ width: '100%', closeOnSelect: false, placeholder: 'All Orders' });
        $('#wh-filter-item').select2({
            width: '100%',
            closeOnSelect: true,
            placeholder: 'All Item Descriptions',
            allowClear: true,
            matcher: function(params, data) {
                var term = $.trim(params.term || '').toLowerCase();
                if (!term) return data;
                var text = (data.text || '').toString().toLowerCase();
                return text.indexOf(term) !== -1 ? data : null;
            }
        });
        // Make search-and-select visually deterministic: after a result is chosen,
        // clear stale search text and force Select2 to repaint the selected chips.
        $('#wh-filter-item')
          .off('select2:select.imsItemFilter select2:unselect.imsItemFilter')
          .on('select2:select.imsItemFilter select2:unselect.imsItemFilter', function() {
              var $el = $(this);
              window.setTimeout(function() {
                  $el.trigger('change.select2');
                  $('.select2-container--open .select2-search__field').val('').trigger('input');
              }, 0);
          });
        $('#wh-filter-vendor').select2({ width: '100%', closeOnSelect: false, placeholder: 'All Vendors' });
        $('#wh-filter-po').val(previousPOs.filter(function(v) { return poIds.indexOf(v) !== -1; })).trigger('change.select2');
        $('#wh-filter-order').val(previousOrders.filter(function(v) { return orderNos.indexOf(v) !== -1; })).trigger('change.select2');
        $('#wh-filter-item').val(previousItems.filter(function(v) { return itemNames.indexOf(v) !== -1; })).trigger('change.select2');
        $('#wh-filter-vendor').val(previousVendors.filter(function(v) { return vendors.indexOf(v) !== -1; })).trigger('change.select2');
    }

    function applyWarehouseFilters() {
        imsPageFilterActive = true;
        // A new filter defines a new Multi-GRN selection scope. Clear hidden/stale selections
        // so Select All can never carry items from the previous unfiltered list.
        selectedWarehousePlanKeys = {};
        $('#wh-select-all-plans').prop('checked', false);
        var poVals = ($('#wh-filter-po').val() || []).map(function(v) { return v.toString().trim().toLowerCase(); });
        var orderVals = ($('#wh-filter-order').val() || []).map(function(v) { return v.toString().trim().toLowerCase(); });
        var itemVals = ($('#wh-filter-item').val() || []).map(function(v) { return v.toString().trim().toLowerCase(); });
        var vendorVals = ($('#wh-filter-vendor').val() || []).map(function(v) { return v.toString().trim().toLowerCase(); });
        var dateVal = ($('#wh-filter-date').val() || '').toString().trim(); 

        var filtered = originalWarehouseReceipts.filter(function(row) {
            var rowPO = (row.poId || '').toString().trim().toLowerCase();
            var rowOrder = (row.orderNo || '').toString().trim().toLowerCase();
            var rowItem = cleanDisplayVal(row.itemDescription || row.productName || row.productId).toString().trim().toLowerCase();
            var rowVendor = (row.vendorName || '').toString().trim().toLowerCase();

            var matchPO = poVals.length ? (poVals.indexOf(rowPO) !== -1) : true;
            var matchOrder = orderVals.length ? (orderVals.indexOf(rowOrder) !== -1) : true;
            var matchItem = itemVals.length ? (itemVals.indexOf(rowItem) !== -1) : true;
            var matchVendor = vendorVals.length ? (vendorVals.indexOf(rowVendor) !== -1) : true;
            var matchDate = true;

            if (dateVal && row.expectedDate) {
               var d1 = formatDateToYYYYMMDD(row.expectedDate);
               var d2 = formatDateToYYYYMMDD(dateVal);
               matchDate = (d1 && d2 && d1 === d2);
            }
            return matchPO && matchOrder && matchItem && matchVendor && matchDate;
        });

        displayWarehouseData(filtered);
    }

    function resetWarehouseFilters() { 
        imsPageFilterActive = false;
        selectedWarehousePlanKeys = {};
        currentWarehouseVisibleReceipts = [];
        $('#wh-select-all-plans').prop('checked', false);

               '<td data-label="Vendor" class="text-xs">' + (plan.vendorName ? plan.vendorName : '') + '</td>' +
               '<td data-label="Expected Date" class="text-xs font-medium text-slate-555 dark:text-slate-404">' + (plan.expectedDate ? plan.expectedDate : '') + '</td>' + 
               '<td data-label="Planned" class="font-semibold text-center">' + plan.plannedQty + '</td>' +
               '<td data-label="Received" class="font-semibold text-indigo-600 text-center">' + plan.totalReceivedQty + '</td>' +
               '<td data-label="Balance" class="font-bold text-rose-600 text-center">' + plan.balanceQty + '</td>' +
               '<td data-label="UOM" class="text-xs font-semibold text-slate-555">' + cleanUom(plan.uom) + '</td>' +
               '<td data-label="Last Edit Status" style="width:155px;max-width:155px;white-space:normal;overflow-wrap:anywhere;word-break:break-word" class="text-[10px] leading-4 font-mono font-semibold text-slate-600 dark:text-slate-400 px-2 py-2">' + formatCompactAuditStamp(plan.lastEditStatus, plan.plannedBy, plan.expectedDate) + '</td>' +
               '<td data-label="Action" class="action-cell">' + actionMarkup + '</td>' +
           '</tr>';
        }).join('');
               
        initOrUpdateDataTable('wh-receipts-table', receiptsHtml, { searching: false });
        // Restore selections after pagination/filter redraws.
        $('#wh-receipts-table').off('draw.dt.imsMultiGrn').on('draw.dt.imsMultiGrn', function() {
          $('.wh-plan-checkbox').each(function() {
            var key = decodeWarehousePlanKeyAttr($(this).attr('data-plan-key'));
            $(this).prop('checked', !!selectedWarehousePlanKeys[key]);
          });
        });
        $('.wh-plan-checkbox').each(function() {
          var key = decodeWarehousePlanKeyAttr($(this).attr('data-plan-key'));
          $(this).prop('checked', !!selectedWarehousePlanKeys[key]);
        });
        safeCreateIcons();
    }

    $(document).on('change', '.wh-plan-checkbox', function() {
        var key = decodeWarehousePlanKeyAttr($(this).attr('data-plan-key'));
        if (!key) return;
        if ($(this).is(':checked')) selectedWarehousePlanKeys[key] = true;
        else delete selectedWarehousePlanKeys[key];
    });

    $(document).on('change', '#wh-select-all-plans', function() {
        var isChecked = $(this).is(':checked');

        // IMPORTANT: Select All applies only to the rows produced by the active Warehouse filters,
        // not to originalWarehouseReceipts and not to hidden rows from any previous filter state.
        selectedWarehousePlanKeys = {};
        (currentWarehouseVisibleReceipts || []).forEach(function(plan) {
          var key = getWarehousePlanKey(plan);
          if (isChecked && key) selectedWarehousePlanKeys[key] = true;
        });

        $('.wh-plan-checkbox').each(function() {
          var key = decodeWarehousePlanKeyAttr($(this).attr('data-plan-key'));

        });

    function populateManagerDashboard(data) {
        var stock = data.binStock || [];
        var html = '';
        var stagingCount = 0;
        managerStockMap = {}; 
        
        stock.forEach(function(item) {
            var binLocStr = String(item.binLocation || '');
            var isStaging = binLocStr.toLowerCase().indexOf('staging') > -1 || binLocStr.toLowerCase().indexOf('inward') > -1;
            if(isStaging) stagingCount += Number(item.qty);
            var itemKey = item.productId + '_' + binLocStr.replace(/\s+/g, '-');
            managerStockMap[itemKey] = item;
            
            html += '<tr class="hover:bg-slate-100 dark:hover:bg-slate-800 transition ' + (isStaging ? 'bg-amber-500/10 dark:bg-amber-900/20' : '') + '">' +
                '<td class="px-6 py-4 font-mono font-semibold text-slate-800 dark:text-white">' + item.productId + '</td>' +
                '<td class="px-6 py-4 font-medium">' + item.productName + '</td>' +
                '<td class="px-6 py-4">' + 
                    '<span class="' + (isStaging ? 'px-2.5 py-1 bg-amber-100 dark:bg-amber-900/30 text-amber-800 dark:text-amber-404 rounded-lg text-xs font-bold border border-amber-200' : 'px-2.5 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-lg text-xs font-semibold border border-slate-200 dark:border-slate-700') + '">' +

      var categories = [...new Set(data.map(function(r){ return r.category; }).filter(Boolean))].sort();
      var orders = [...new Set(data.map(function(r){ return r.orderNo; }).filter(Boolean))].sort();
      var configs = [
        { sel:'#stock-filter-product', vals:products, placeholder:'All Products' },
        { sel:'#stock-filter-category', vals:categories, placeholder:'All Categories' },
        { sel:'#stock-filter-po', vals:orders, placeholder:'All PO / Orders' }
      ];
      configs.forEach(function(cfg){
        var prev = $(cfg.sel).val() || [];
        safeSelect2Destroy(cfg.sel);
        var $el = $(cfg.sel).empty().attr('multiple','multiple');
        cfg.vals.forEach(function(v){ $el.append('<option value="'+escapeAttr(v)+'">'+escapeHtmlSafe(v)+'</option>'); });
        $el.select2({ width:'100%', closeOnSelect:false, placeholder:cfg.placeholder, allowClear:true });
        $el.val(prev.filter(function(v){ return cfg.vals.indexOf(v) !== -1; })).trigger('change.select2');
      });
    }

    function escapeRegexValue_(value) {
      return String(value == null ? '' : value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function applyStockReportFilters() {
      var dt = tableInstances['stockTable'];
      if (!dt || !dt.column) return;
      var productVals = $('#stock-filter-product').val() || [];
      var categoryVals = $('#stock-filter-category').val() || [];
      var orderVals = $('#stock-filter-po').val() || [];
      function pattern(vals) {
        if (!vals.length) return '';
        return '^(?:' + vals.map(escapeRegexValue_).join('|') + ')$';
      }
      dt.column(0).search(pattern(productVals), true, false);
      dt.column(2).search(pattern(categoryVals), true, false);
      dt.column(4).search(pattern(orderVals), true, false);
      dt.draw();
    }

    function loadStockReport(forceRefresh) {
      var cached = !forceRefresh ? getCachedViewData_('stockReport') : null;
      if (cached) { populateStockTable(cached); return; }
      showLoading(true);
      google.script.run
        .withSuccessHandler(function(data) { setCachedViewData_('stockReport', data || { warehouses: [], reportData: [] }); populateStockTable(data || { warehouses: [], reportData: [] }); })
        .withFailureHandler(onFailure)
        .getStockReport();
    }

    function showProductionMaterialReturnPopup(productId, productName, maxStock, suggestedWarehouse) {
        var isDark = $('html').hasClass('dark');

        var options = '';

        var suggestedNorm = normalizeWarehouseId(suggestedWarehouse || '');
        var seenReturnWarehouses = {};

        // The original/source warehouse must always be selectable, even when
        // it has the same WarehouseID as the Production user.
        if (suggestedNorm) {
            options += '<option value="' + escapeAttr(suggestedNorm) + '" selected>' + escapeHtmlSafe(suggestedNorm) + ' (Original Source)</option>';
            seenReturnWarehouses[suggestedNorm] = true;
        }

        warehouses.forEach(function(whObj) {
            var wh = normalizeWarehouseId(typeof whObj === 'string' ? whObj : (whObj.id || whObj.warehouseId || whObj.code || ''));

            var selected = !suggestedNorm && wh === userWh ? ' selected' : '';
            var suffix = wh === userWh ? ' (Same Warehouse)' : '';
            options += '<option value="' + escapeAttr(wh) + '"' + selected + '>' + escapeHtmlSafe(wh) + suffix + '</option>';
            seenReturnWarehouses[wh] = true;
        });

        // If global warehouse list is stale, still allow the logged-in
        // warehouse as a valid same-code return destination.
        if (userWh && !seenReturnWarehouses[userWh]) {
            options += '<option value="' + escapeAttr(userWh) + '"' + (!suggestedNorm ? ' selected' : '') + '>' + escapeHtmlSafe(userWh) + ' (Same Warehouse)</option>';
        }

                  '<p><strong>Available / Left Stock:</strong> <span class="font-extrabold text-amber-600">' + maxStock + '</span></p>' +
                '</div>' +
                '<div>' +

                  '<select id="prod-return-wh" class="form-input-styled bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-700 font-bold">' +
                    options +
                  '</select>' +
                '</div>' +
                '<div>' +
                  '<label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-1">Return Quantity</label>' +
                  '<input type="number" id="prod-return-qty" class="form-input-styled bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-700 font-bold text-amber-600" value="' + maxStock + '" min="1" max="' + maxStock + '" step="any">' +
                  '<p class="mt-1 text-[11px] text-slate-500">You can return the full leftover quantity or a partial quantity.</p>' +
                '</div>' +
                '<div>' +
                  '<label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-1">Return Reason *</label>' +
                  '<textarea id="prod-return-reason" rows="3" class="form-input-styled bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-700" placeholder="Why is this material being returned?"></textarea>' +
                  '<p class="mt-1 text-[11px] text-slate-500">Target warehouse will verify this reason before accepting the material into stock.</p>' +
                '</div>' +
              '</div>',
            showCancelButton: true,
            confirmButtonText: 'Return Material',
            cancelButtonText: 'Cancel',
            confirmButtonColor: '#f59e0b',
            cancelButtonColor: '#4b5563',
            preConfirm: function() {
                var targetWh = normalizeWarehouseId($('#prod-return-wh').val() || '');
                var qty = Number($('#prod-return-qty').val());
                var returnReason = ($('#prod-return-reason').val() || '').toString().trim();
                if (!targetWh) {
                    Swal.showValidationMessage('Please select the warehouse where material should be returned.');
                    return false;
                }
                if (!Number.isFinite(qty) || qty <= 0) {

                }
                if (qty > maxStock) {

            showLoading(true);

                  }).then(function() { loadDashboardData(); });

              })
              .returnProductionMaterial(result.value, currentUser);

            '</div>' +
            '<div>' +

            '</div>' +

        cancelButtonText: 'Cancel',
        confirmButtonColor: '#e11d48',

        didOpen: function() {
            $('#prod-reject-reason-select').on('change', function() {

                    $('#prod-reject-reason-text').removeClass('hidden').focus();
                } else {
                    $('#prod-reject-reason-text').addClass('hidden');
                }
            });
        },
        preConfirm: function() {
            var rejectQty = Number(document.getElementById('prod-reject-qty').value);
            var reasonSel = document.getElementById('prod-reject-reason-select').value;
            var reasonText = document.getElementById('prod-reject-reason-text').value.trim();

            if (isNaN(rejectQty) || rejectQty <= 0) {

            if (rejectQty > maxStock) {

    function showProductionRequestPopup(productId, productName, orderNo, uom) {
        var isDark = $('html').hasClass('dark');

        var warehouseStocks = (window.stockReportLookup && window.stockReportLookup[productId]) ? window.stockReportLookup[productId] : {};

        if ((!uom || uom === 'undefined' || uom === 'null') && window.stockReportUOMLookup) {
            uom = window.stockReportUOMLookup[productId] || '';
        }
        
        var cleanUomStr = cleanUom(uom);
        var reqQtyLabel = cleanUomStr ? 'Required Qty (' + cleanUomStr + ')' : 'Required Qty';

        var whOptions = '';
        var availableWhCount = 0;

        // Source-WH options must come from the SAME stock snapshot used by the
        // visible Stock Report. Previously this loop depended only on
        // globalLists.warehouses; if that cached list was stale / not loaded,
        // the table could show W3 stock while this popup incorrectly showed
        // "no stock available".
        var whCandidates = [];
        function addWhCandidate_(value) {
            var whId = (value == null ? '' : String(value)).trim().toUpperCase();
            if (whId && whCandidates.indexOf(whId) === -1) whCandidates.push(whId);
        }

        (window.stockReportWarehouses || []).forEach(addWhCandidate_);
        Object.keys(warehouseStocks || {}).forEach(addWhCandidate_);
        if (globalLists && Array.isArray(globalLists.warehouses)) {

        }

        // Normalize stock-map keys as well, so W3 / "w3" / spaced IDs all match.
        var normalizedWarehouseStocks = {};
        Object.keys(warehouseStocks || {}).forEach(function(key) {
            var normalizedKey = (key == null ? '' : String(key)).trim().toUpperCase();
            if (!normalizedKey) return;
            normalizedWarehouseStocks[normalizedKey] = Number(normalizedWarehouseStocks[normalizedKey] || 0) + Number(warehouseStocks[key] || 0);

        whCandidates.forEach(function(wh) {

                  '<div><strong class="text-slate-500">UOM:</strong> <span class="font-bold text-indigo-600 dark:text-indigo-404 block mt-0.5">' + (cleanUomStr ? cleanUomStr : '') + '</span></div>' +
                '</div>' +

                '<div>' +
                  '<label class="block text-xs font-bold text-slate-500 dark:text-slate-404 uppercase mb-1">Source Warehouse (Request From) <span class="text-rose-500">*</span></label>' +
                  '<select id="prod-req-source-wh" class="form-input-styled bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-700 font-bold" required>' +
                    whOptions +

    function escapeAttr(str) {
      if (str === null || str === undefined || str === 'undefined') return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/[\r\n]+/g, ' ');
    }

      $row.find('.req-product-select').on('change', function() {
          var pId = $(this).val();
          var stockVal = sourceWarehouseStockMap[pId] || 0;
          var $requestRow = $(this).closest('tr');
          var stockInput = $requestRow.find('.req-current-stock');
          var qtyInput = $requestRow.find('.req-qty-input');
          stockInput.val(stockVal);
          qtyInput.attr('max', stockVal).attr('data-available-stock', stockVal);
          if (Number(qtyInput.val() || 0) > Number(stockVal)) qtyInput.val(stockVal > 0 ? stockVal : '');
          
          if(stockVal < 10) {
              stockInput.addClass('text-rose-600 font-bold bg-rose-50 dark:bg-rose-955/20 border-rose-200'); 
          } else {
              stockInput.removeClass('text-rose-600 font-bold bg-rose-50 dark:bg-rose-955/20 border-rose-200');
          }
      }).trigger('change');
    }
    
    function handleMultiRequestSubmit(e) {
        e.preventDefault();
        var orderNo = $('#req-order-no').val().trim();
        var requestPerson = $('#req-person-name').val().trim();
        var sourceWh = $('#req-source-wh').val();
        
        if(!orderNo || !sourceWh || !requestPerson) { 
            Swal.fire('Error', 'Verify required fields.', 'error'); 
            return; 
        }
        
        var items = [];
        var cumulativeByProduct = {};
        var validationError = '';
        $('#req-items-body tr').each(function() {
            var pId = $(this).find('.req-product-select').val();
            var qty = Number($(this).find('.req-qty-input').val());
            var available = Number(sourceWarehouseStockMap[pId] || 0);
            if(pId && qty > 0) { 
                cumulativeByProduct[pId] = (cumulativeByProduct[pId] || 0) + qty;
                if (cumulativeByProduct[pId] > available && !validationError) {
                    validationError = 'Available stock limit exceeded for ' + pId + '. Available: ' + available + ', requested: ' + cumulativeByProduct[pId] + '.';
                }
                items.push({ productId: pId, qty: qty }); 
            }
        });
        if (validationError) {
            Swal.fire('Stock Limit Exceeded', validationError, 'error');
            return;
        }
        
        if(items.length === 0) { 
            Swal.fire('Empty Request', 'Please add at least one item.', 'warning'); 
            return; 
        }
        
        var payload = { 
            orderNo: orderNo, 
            requestPerson: requestPerson,
            requestedBy: requestPerson, 
            sourceWarehouse: sourceWh, 
            items: items 
        };
        showLoading(true);
        google.script.run.withSuccessHandler(onSuccessForm).withFailureHandler(onFailure).requestMaterial(payload, currentUser);
    }

    function populatePlannerFilters(data) {
        var poIds = [...new Set(data.map(function(item) { return item.poId; }).filter(Boolean))]; 
        var orderNos = [...new Set(data.map(function(item) { return item.orderNo; }).filter(Boolean))]; 
        var uniqueCodes = [...new Set(data.map(function(item) { return item.productId; }).filter(Boolean))]; 
        var itemNames = [...new Set(data.map(function(item) { return item.itemDescription; }).filter(Boolean))];
        var vendors = [...new Set(data.map(function(item) { return item.vendorName; }).filter(Boolean))];
        
        safeSelect2Destroy('#filter-po-id');
        safeSelect2Destroy('#filter-order-no');
        safeSelect2Destroy('#filter-unique-code');
        safeSelect2Destroy('#filter-item-name');
        safeSelect2Destroy('#filter-vendor-name');

        var previousPOs = $('#filter-po-id').val() || [];
        var previousOrders = $('#filter-order-no').val() || [];
        var previousProducts = $('#filter-unique-code').val() || [];
        var previousItems = $('#filter-item-name').val() || [];
        var previousVendors = $('#filter-vendor-name').val() || [];
        var poIdSelect = $('#filter-po-id').empty(); 
        poIds.sort().forEach(function(id) { poIdSelect.append('<option value="' + id + '">' + id + '</option>'); });
        
        var orderNoSelect = $('#filter-order-no').empty(); 
        orderNos.sort().forEach(function(no) { orderNoSelect.append('<option value="' + no + '">' + no + '</option>'); });
        
        var uniqueCodeSelect = $('#filter-unique-code').empty(); 
        uniqueCodes.sort().forEach(function(code) { uniqueCodeSelect.append('<option value="' + escapeAttr(code) + '">' + code + '</option>'); });

        var itemNameSelect = $('#filter-item-name').empty();
        itemNames.sort().forEach(function(item) { itemNameSelect.append('<option value="' + escapeAttr(item) + '">' + item + '</option>'); });

        var vendorSelect = $('#filter-vendor-name').empty();
        vendors.sort().forEach(function(vendor) { vendorSelect.append('<option value="' + escapeAttr(vendor) + '">' + vendor + '</option>'); });
        
        $('#filter-po-id, #filter-order-no, #filter-unique-code, #filter-item-name, #filter-vendor-name').attr('multiple', 'multiple');
        $('#filter-po-id').select2({ width: '100%', closeOnSelect: false, placeholder: 'All PO IDs', allowClear: true });
        $('#filter-order-no').select2({ width: '100%', closeOnSelect: false, placeholder: 'All Orders', allowClear: true });
        $('#filter-unique-code').select2({ width: '100%', closeOnSelect: false, placeholder: 'All Products', allowClear: true });
        $('#filter-item-name').select2({ width: '100%', closeOnSelect: false, placeholder: 'All Item Names', allowClear: true });
        $('#filter-vendor-name').select2({ width: '100%', closeOnSelect: false, placeholder: 'All Vendors', allowClear: true });
        $('#filter-po-id').val(previousPOs.filter(function(v) { return poIds.indexOf(v) !== -1; })).trigger('change.select2');
        $('#filter-order-no').val(previousOrders.filter(function(v) { return orderNos.indexOf(v) !== -1; })).trigger('change.select2');
        $('#filter-unique-code').val(previousProducts.filter(function(v) { return uniqueCodes.indexOf(v) !== -1; })).trigger('change.select2');
        $('#filter-item-name').val(previousItems.filter(function(v) { return itemNames.indexOf(v) !== -1; })).trigger('change.select2');
        $('#filter-vendor-name').val(previousVendors.filter(function(v) { return vendors.indexOf(v) !== -1; })).trigger('change.select2');
    }

    function applyPlannerFilters() {
        imsPageFilterActive = true;
        var poIdFilters = ($('#filter-po-id').val() || []).map(function(v) { return v.toString().trim().toLowerCase(); }); 
        var orderNoFilters = ($('#filter-order-no').val() || []).map(function(v) { return v.toString().trim().toLowerCase(); }); 
        var uniqueCodeFilters = ($('#filter-unique-code').val() || []).map(function(v) { return v.toString().trim().toLowerCase(); }); 
        var itemNameFilters = ($('#filter-item-name').val() || []).map(function(v) { return v.toString().trim().toLowerCase(); });
        var vendorFilters = ($('#filter-vendor-name').val() || []).map(function(v) { return v.toString().trim().toLowerCase(); });
        var dateFilter = ($('#filter-date').val() || '').toString().trim();
        
        var filteredData = originalPlannerData.filter(function(po) {
          var poId = (po.poId || '').toString().trim().toLowerCase();
          var orderNo = (po.orderNo || '').toString().trim().toLowerCase();
          var prodId = (po.productId || '').toString().trim().toLowerCase();
          var itemName = (po.itemDescription || '').toString().trim().toLowerCase();
          var vendorName = (po.vendorName || '').toString().trim().toLowerCase();

          var matchPO = poIdFilters.length ? (poIdFilters.indexOf(poId) !== -1) : true;
          var matchOrder = orderNoFilters.length ? (orderNoFilters.indexOf(orderNo) !== -1) : true;
          var matchProduct = uniqueCodeFilters.length ? (uniqueCodeFilters.indexOf(prodId) !== -1) : true;
          var matchItemName = itemNameFilters.length ? (itemNameFilters.indexOf(itemName) !== -1) : true;
          var matchVendor = vendorFilters.length ? (vendorFilters.indexOf(vendorName) !== -1) : true;
          var matchDate = true;

          if (dateFilter && po.date) {
            var d1 = formatDateToYYYYMMDD(po.date);
            var d2 = formatDateToYYYYMMDD(dateFilter);
            matchDate = (d1 && d2 && d1 === d2);
          }

          return matchPO && matchOrder && matchProduct && matchItemName && matchVendor && matchDate;
        });

        displayPlannerData(filteredData);
    }

    function resetPlannerFilters() {
        imsPageFilterActive = false;
        safeSelect2Destroy('#filter-po-id');

        safeSelect2Destroy('#filter-unique-code');

        $('#filter-vendor-name').val([]);

    }
