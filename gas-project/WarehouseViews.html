<!-- warehouseManagerView -->
<div id="warehouseManagerView" class="view hidden space-y-6">
          <div
            class="bg-white dark:bg-[#111827] p-6 rounded-xl border border-slate-200 dark:border-[#1e293b] shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="space-y-1">
              <span class="text-xs uppercase font-extrabold text-indigo-600 dark:text-indigo-400 tracking-wider">Internal Layout Strategy</span>
              <h3 class="text-xl font-bold text-slate-800 dark:text-white">Bin & Rack Operations Console</h3>
            </div>
            <div
              class="text-sm bg-indigo-50 dark:bg-indigo-950 border border-indigo-100 dark:border-indigo-900/50 text-indigo-700 dark:text-indigo-300 py-2 px-4 rounded-xl flex items-center space-x-2">
              <i data-lucide="building" class="w-4 h-4"></i>
              <span>Active Warehouse ID: <strong id="mgr-wh-id"></strong></span>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div
              class="bg-white dark:bg-[#111827] p-6 rounded-xl border border-slate-200 dark:border-[#1e293b] shadow-sm flex items-center space-x-4">
              <div
                class="bg-amber-50 dark:bg-amber-955 text-amber-600 dark:text-amber-404 p-4 rounded-xl border border-amber-100 dark:border-[#1e293b]">
                <i data-lucide="warehouse" class="w-8 h-8"></i>
              </div>
              <div>
                <p class="text-xs font-semibold text-slate-555 dark:text-slate-404 uppercase tracking-wider">Material in
                  Staging Area</p>
                <h2 id="stat-staging-qty" class="text-3xl font-extrabold text-slate-800 dark:text-white">0</h2>
              </div>
            </div>
            <div
              class="bg-white dark:bg-[#111827] p-6 rounded-xl border border-slate-200 dark:border-[#1e293b] shadow-sm flex items-center space-x-4">
              <div
                class="bg-indigo-50 dark:bg-indigo-955 text-indigo-600 dark:text-indigo-400 p-4 rounded-xl border border-indigo-100 dark:border-[#1e293b]">
                <i data-lucide="boxes" class="w-8 h-8"></i>
              </div>
              <div>
                <p class="text-xs font-semibold text-slate-555 dark:text-slate-404 uppercase tracking-wider">Distinct
                  Tracked Bins</p>
                <h2 id="stat-total-products" class="text-3xl font-extrabold text-slate-800 dark:text-white">0</h2>
              </div>
            </div>
          </div>

          <div
            class="bg-white dark:bg-[#111827] rounded-xl border border-slate-200 dark:border-[#1e293b] shadow-sm overflow-hidden">
            <div
              class="p-6 border-b border-slate-200 dark:border-[#1e293b] bg-slate-50 dark:bg-[#151c2c] flex flex-col sm:flex-row justify-between items-center gap-4">
              <h4 class="font-bold text-slate-800 dark:text-white">Internal Storage Location Blueprint</h4>
              <div class="relative w-full sm:w-64">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-404"><i data-lucide="search" class="w-4 h-4"></i></span>
                <input type="text" id="bin-search" placeholder="Search product/bin..." class="w-full pl-9 pr-4 py-2 border border-slate-300 dark:border-[#1e293b] rounded-lg text-sm bg-white dark:bg-[#1e293b] text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/25">
              </div>
            </div>
            <div class="overflow-x-auto">
              <table id="manager-bin-table" class="w-full text-sm text-left text-slate-700 dark:text-slate-300"
                style="width:100%">
                <thead
                  class="text-xs text-slate-600 dark:text-slate-404 uppercase bg-slate-50 dark:bg-[#151c2c] font-bold border-b border-slate-200 dark:border-[#1e293b]">
                  <tr>
                    <th class="px-6 py-4">Product ID</th>
                    <th class="px-6 py-4">Product Name</th>
                    <th class="px-6 py-4">Current Bin/Rack</th>
                    <th class="px-6 py-4">Qty</th>
                    <th class="px-6 py-4 text-right">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-[#1e293b] bg-white dark:bg-[#111827]"></tbody>
              </table>
            </div>
          </div>
        </div>
